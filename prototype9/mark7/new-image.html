<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Image → Word Summary</title>
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; background: #111; color: #fff; }
    button { padding: 10px 20px; margin-top: 10px; border: none; border-radius: 6px; cursor: pointer; }
    #preview { margin-top: 20px; max-width: 300px; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>Image → Summary Word</h2>

  <input type="file" id="fileInput" accept="image/*" />
  <button id="sendBtn">解析</button>

  <img id="preview" />
  <div id="output"></div>
  <pre id="out"></pre>
<script>
const API_URL = "https://dr-cube-1.onrender.com/chat";

document.getElementById("fileInput").addEventListener("change", handleFile);
document.getElementById("sendBtn").addEventListener("click", processImage);

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById("preview").src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function processImage() {
  const img = document.getElementById("preview").src;
  if (!img) return;

  // 1. 画像から文章を抽出
  const prompt1 = "以下の画像から読み取れる文章を出力してください。画像: " + img;
  const payload1 = { prompt: prompt1, image: img };

  try {
    const res1 = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload1)
    });

    if (!res1.ok) throw new Error("API Error: " + res1.status);

    const data1 = await res1.json();
    const wordText = data1?.reply?.trim() || "(no result)";

    document.getElementById("output").innerText = "画像解析結果: " + wordText;
    document.getElementById("out").textContent = JSON.stringify(wordText, null, 2);

    // 🔹 親ページへ送信
    parent.postMessage({ type: 'IMAGE_RESULT', payload: wordText }, location.origin);

    // 2. 解析結果の文章から熟語抽出
    const prompt2 = "\n\n文章: " + wordText + "以下の文章から熟語（2字以上の漢字のまとまり）だけを抽出し、JSON配列で返してください。";
    const payload2 = { prompt: prompt2 };

    const res2 = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload2)
    });

    if (!res2.ok) throw new Error("API Error: " + res2.status);

    const data2 = await res2.json();
    const jukugo = data2?.reply?.trim() || "(no result)";

    document.getElementById("output").innerText += "\n熟語抽出結果: " + jukugo;
    document.getElementById("out").textContent += "\n" + JSON.stringify(jukugo, null, 2);

    // 🔹 親ページへ送信
    parent.postMessage({ type: 'TEXT_RESULT', payload: jukugo }, location.origin);

  } catch (err) {
    console.error(err);
    document.getElementById("output").innerText = "エラー: " + err.message;
  }
}
</script>
</body>
<body>
  <h1>文章から熟語抽出</h1>
  <textarea id="inputText" rows="6" cols="60" placeholder="ここに文章を入力してください"></textarea><br>
  <button id="extractBtn">熟語を抽出</button>

  <h2>抽出結果</h2>
  <pre id="result"></pre>

  <script>
    const API_KEY = "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"; // ← OpenAIのAPIキーを入れてください

    document.getElementById("extractBtn").addEventListener("click", async () => {
      const text = document.getElementById("inputText").value;

      const messages = [
        { role: "system", content: "あなたは日本語の言語処理に詳しいアシスタントです。" },
        { role: "user", content: `以下の文章から熟語（2字以上の漢字のまとまり）だけを抽出し、JSON配列で返してください。\n\n文章: ${text}` }
      ];

      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: "gpt-4.1-mini",
          messages: messages,
          temperature: 0
        })
      });

      const data = await response.json();
      const result = data.choices[0].message.content;
      document.getElementById("result").textContent = result;
    });
  </script>
</body>
</html>
