<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Image → Word Summary</title>
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; background: #111; color: #fff; }
    button { padding: 10px 20px; margin-top: 10px; border: none; border-radius: 6px; cursor: pointer; }
    #preview { margin-top: 20px; max-width: 300px; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>Image → Summary Word</h2>

  <input type="file" id="fileInput" accept="image/*" />
  <button id="sendBtn">解析</button>

  <img id="preview" />
  <div id="output"></div>
  <pre id="out"></pre> //編集済み

<script>
const API_URL = "https://dr-cube-1.onrender.com/chat";

document.getElementById("fileInput").addEventListener("change", handleFile);
document.getElementById("sendBtn").addEventListener("click", processImage);

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById("preview").src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function processImage() {
  const img = document.getElementById("preview").src;
  if (!img) return;

  const prompt = "以下の画像から読み取れる単語のみ（複数）を出力してください。画像: " + img;
  const payload = { prompt, image: img };

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok) throw new Error("API Error: " + res.status);

    const data = await res.json();
    const word = data?.reply?.trim() || "(no result)";

    document.getElementById("output").innerText = "結果（デバック１）: " + word;
//--------------------------------------編集済み
    const out = document.getElementById('out');
    out.textContent = JSON.stringify(word, null, 2);

  // 🔹 親ページへ送信
  parent.postMessage({
    type: 'IMAGE_RESULT',
    payload: word
  }, location.origin);
//------------------------------------

  } catch (err) {
    console.error(err);
    document.getElementById("output").innerText = "エラー: " + err.message;
  }
}

//------------------------------編集2

  const prompt2 = "以下の画像から読み取れる単語のみ（複数）を出力してください。画像: " + img;
  const payload2 = { prompt2, image: img };

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload2)
    });

    if (!res.ok) throw new Error("API Error: " + res.status);

    const data2 = await res.json();
    const imword = data2?.reply?.trim() || "(no result)";

    document.getElementById("output").innerText = "結果2（デバック１）: " + word;

    const out = document.getElementById('out');
    out.textContent = JSON.stringify(imword, null, 2);

  // 🔹 親ページへ送信
  parent.postMessage({
    type: 'IMAGE_RESULT',
    payload: imword
  }, location.origin);
   } catch (err) {
    console.error(err);
    document.getElementById("output").innerText = "エラー: " + err.message;
  }

</script>



</body>

  <script>
