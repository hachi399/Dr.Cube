<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Two Panels Sharing IndexedDB — iframe を使わない安定版</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#0ea5ff;--muted:#94a3b8}
    html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,'Hiragino Kaku Gothic ProN',sans-serif;background:linear-gradient(180deg,#071129 0%,#071827 100%);color:#e6eef8}
    .container{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:18px;height:calc(100% - 140px);box-sizing:border-box}
    .panel{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);padding:18px;border-radius:12px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
    h2{margin:0;font-size:18px}
    .value{font-size:28px;font-weight:700}
    button{background:var(--accent);color:#04263b;padding:10px 14px;border-radius:8px;border:none;cursor:pointer}
    .controls{display:flex;gap:8px}
    .small{font-size:13px;padding:6px 8px;border-radius:6px;background:#0b1220;color:var(--muted);border:1px solid rgba(255,255,255,0.02)}
    .hint{padding:12px;margin:12px;color:var(--muted);font-size:13px}
    footer{padding:12px;display:flex;gap:8px;align-items:center}
    pre{background:#031024;padding:8px;border-radius:6px;overflow:auto}
  </style>
</head>
<body>
  <div class="container">
    <section class="panel" id="panelA">
      <h2>ページA（+100）</h2>
      <div class="value" id="valueA">読み込み中…</div>
      <div class="controls">
        <button id="btnPlus">+100 を加算して保存</button>
        <button class="small" id="btnRefreshA">更新</button>
      </div>
      <div class="hint">このパネルは親ドキュメントで直接動いています（iframe を使わず安定化）。IndexedDB に保存された値を読み書きします。</div>
    </section>

    <section class="panel" id="panelB">
      <h2>ページB（-200）</h2>
      <div class="value" id="valueB">読み込み中…</div>
      <div class="controls">
        <button id="btnMinus">-200 を加算して保存</button>
        <button class="small" id="btnRefreshB">更新</button>
      </div>
      <div class="hint">どちらかのボタンで値を更新すると両方のパネルが反映されます。</div>
    </section>
  </div>

  <footer>
    <button class="small" id="btnReset">リセット (0)</button>
    <button class="small" id="btnRunTests">自動テストを実行</button>
    <div style="flex:1"></div>
    <div style="min-width:320px">デバッグ: <span id="dbg">---</span></div>
  </footer>

  <script>
  // このバージョンは iframe を使わず親ページで直接 IndexedDB を操作します。
  // 利点: ブラウザや sandbox の影響を受けず確実に動作します。もし「iframe 必須」であれば教えてください。

  // --- IndexedDB ヘルパー ---
  function openDB(){
    return new Promise((res,rej)=>{
      const r = indexedDB.open('shared-counter-db', 1);
      r.onupgradeneeded = e => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains('store')) db.createObjectStore('store');
      };
      r.onsuccess = e => res(e.target.result);
      r.onerror = e => rej(e.target.error);
    });
  }

  async function getValue(){
    const db = await openDB();
    return new Promise((res,rej)=>{
      const tx = db.transaction('store','readonly');
      const st = tx.objectStore('store');
      const rq = st.get('value');
      rq.onsuccess = ()=> res(rq.result ?? 0);
      rq.onerror = ()=> rej(rq.error);
    });
  }

  async function setValue(v){
    const db = await openDB();
    return new Promise((res,rej)=>{
      const tx = db.transaction('store','readwrite');
      const st = tx.objectStore('store');
      const rq = st.put(v,'value');
      rq.onsuccess = ()=> res();
      rq.onerror = ()=> rej(rq.error);
    });
  }

  // UI 更新
  const elA = document.getElementById('valueA');
  const elB = document.getElementById('valueB');
  const dbg = document.getElementById('dbg');

  async function refreshAll(){
    try{
      const v = await getValue();
      elA.textContent = v;
      elB.textContent = v;
      dbg.textContent = `値: ${v}`;
    }catch(e){
      console.error(e);
      dbg.textContent = 'エラー: '+(e && e.message);
    }
  }

  document.getElementById('btnPlus').addEventListener('click', async ()=>{
    try{
      const cur = await getValue();
      await setValue(cur + 100);
      await refreshAll();
    }catch(e){ console.error(e); dbg.textContent = 'Error: '+e.message; }
  });

  document.getElementById('btnMinus').addEventListener('click', async ()=>{
    try{
      const cur = await getValue();
      await setValue(cur - 200);
      await refreshAll();
    }catch(e){ console.error(e); dbg.textContent = 'Error: '+e.message; }
  });

  document.getElementById('btnRefreshA').addEventListener('click', refreshAll);
  document.getElementById('btnRefreshB').addEventListener('click', refreshAll);
  document.getElementById('btnReset').addEventListener('click', async ()=>{ await setValue(0); await refreshAll(); });

  // --- 自動テスト ---
  // テストケースを追加しました: 初期0, +100を2回、-200を1回 => 最終値は 0 + 100*2 - 200 = 0
  async function runTests(){
    const results = [];
    try{
      await setValue(0);
      let v = await getValue();
      results.push({name:'initial 0', pass: v === 0, got:v, want:0});

      // +100 x2
      const cur1 = await getValue();
      await setValue(cur1 + 100);
      await setValue((await getValue()) + 100);
      v = await getValue();
      results.push({name:'+100 x2', pass: v === 200, got:v, want:200});

      // -200 x1
      await setValue(v - 200);
      v = await getValue();
      results.push({name:'-200 x1', pass: v === 0, got:v, want:0});

      // final check: mixed sequence
      await setValue(500);
      await setValue((await getValue()) - 200); // 300
      await setValue((await getValue()) + 100); // 400
      v = await getValue();
      results.push({name:'mixed', pass: v === 400, got:v, want:400});

    }catch(e){ results.push({name:'exception', pass:false, error: String(e)}); }

    // show results
    const ok = results.every(r => r.pass);
    dbg.textContent = ok ? 'All tests passed' : 'Some tests failed';
    const out = results.map(r=> r.pass ? `✓ ${r.name}` : `✗ ${r.name} (got ${r.got} want ${r.want})`).join('\n');
    alert('テスト結果:\n'+out);
    await refreshAll();
  }

  document.getElementById('btnRunTests').addEventListener('click', runTests);

  // 初回表示
  refreshAll();

  // 親からも呼べるデバッグAPI
  window.__sharedCounter = {
    read: getValue,
    write: setValue
  };
  </script>
</body>
</html>
