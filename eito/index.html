<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMLサンプル</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .notice {
            background: rgba(255, 255, 255, 0.2);
            border-left: 4px solid #fff;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }

        .notice h2 {
            margin-top: 0;
            color: #ffd700;
        }

        p {
            line-height: 1.8;
            font-size: 1.1em;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>HTMLサンプル</h1>

        <div class="notice">
            <h2>⚠️ これはサンプルです</h2>
            <p>このHTMLファイルはサンプルとして作成されました。</p>
            <p>実際のコンテンツに置き換えてご利用ください。</p>
        </div>

        <h2>使い方</h2>
        <p>このファイルを編集して、あなたのプロジェクトに合わせてカスタマイズしてください。</p>

        <h2>次のステップ</h2>
        <ul>
            <li>HTMLの構造を編集</li>
            <li>CSSスタイルを調整</li>
            <li>JavaScriptを追加</li>
            <li>コンテンツを追加</li>
        </ul>
    </div>
</body>

</html>
