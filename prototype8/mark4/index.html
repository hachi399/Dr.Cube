<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Swipe Card App — Fixed iframe state</title>
<style>
html,body{height:100%;}
body{
  margin:0;
  background:#111;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
}
#cardArea{
  display:flex;
  width:100vw;
  height:100vh;
}
.card{
  flex:1;
  background:#333;
  border-radius:12px;
  margin:2px;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
}
.card-type{padding:8px}
.type-analysis{background:#ff6b5f}
.type-idea{background:#3aa0ff}
.type-image{background:#2fb86b}
.iframe-wrap{flex:1}
.swipe-layer{position:absolute;inset:0;z-index:10}
</style>
</head>
<body>

<div id="cardArea"></div>

<script>
const PAGE_URL = {
  idea: "idea.html",
  analysis: "analysis.html",
  image: "image.html"
};

// --------------------
// カード管理
// --------------------
let uid = 0;
function createCard(type,label){
  return { id: ++uid, type, label };
}

let deck = [
  createCard('analysis','解析(4)'),
  createCard('analysis','解析(6)'),
  createCard('idea','発想(5)'),
  createCard('image','画像'),
  createCard('analysis','解析(2)'),
  createCard('idea','発想(3)'),
  createCard('idea','発想(1)')
];

let centerIndex = 3;
const cardArea = document.getElementById("cardArea");

// DOM 永続マップ
const cardDomMap = new Map();

// --------------------
// カードDOM生成（1回だけ）
// --------------------
function createCardDOM(card){
  const el = document.createElement("div");
  el.className = "card type-" + card.type;

  const label = document.createElement("div");
  label.className = "card-type";
  label.textContent = card.label;
  el.appendChild(label);

  const wrap = document.createElement("div");
  wrap.className = "iframe-wrap";

  const iframe = document.createElement("iframe");
  iframe.style.width = "100%";
  iframe.style.height = "100%";
  iframe.style.border = "none";
  iframe.src = PAGE_URL[card.type]; // ★一度だけ

  wrap.appendChild(iframe);
  el.appendChild(wrap);

  const overlay = document.createElement("div");
  overlay.className = "swipe-layer";
  el.appendChild(overlay);

  // swipe
  overlay.addEventListener("pointerdown", e=>{
    overlay._startX = e.clientX;
  });
  overlay.addEventListener("pointerup", e=>{
    const dx = e.clientX - overlay._startX;
    if(Math.abs(dx) < 40) return;

    const newType = dx > 0 ? "idea" : "analysis";
    const newCard = createCard(
      newType,
      newType === "idea" ? "発想" : "解析"
    );
    const index = deck.findIndex(c=>c.id===card.id);
    deck.splice(index+1,0,newCard);
    centerIndex = index+1;
    render();
  });

  return el;
}

// --------------------
// 描画（DOM再利用）
// --------------------
function render(){
  cardArea.innerHTML = "";

  const start = Math.max(0, centerIndex-1);
  const end   = Math.min(deck.length-1, centerIndex+2);

  for(let i=start;i<=end;i++){
    const card = deck[i];
    if(!cardDomMap.has(card.id)){
      cardDomMap.set(card.id, createCardDOM(card));
    }
    cardArea.appendChild(cardDomMap.get(card.id));
  }
}

render();
</script>
</body>
</html>
