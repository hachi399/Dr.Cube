<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Swipe Card App — Fixed iframe State</title>
<style>
  html,body{height:100%;}
  body{
    margin:0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    background:#111;color:#fff;
    display:flex;flex-direction:column;align-items:center;
  }
  #cardArea{display:flex;width:100vw;height:100vh;}
  .card{
    flex:1;height:100%;border-radius:12px;background:#333;
    box-shadow:0 8px 20px rgba(0,0,0,.6);
    overflow:hidden;position:relative;
    display:flex;flex-direction:column;
  }
  .card-type{padding:8px 12px}
  .iframe-wrap{flex:1}
  iframe{width:100%;height:100%;border:none}
  .swipe-layer{position:absolute;inset:0;z-index:10}
  #controls{margin:12px}
</style>
</head>
<body>

<div id="cardArea"></div>

<div id="controls">
  <button id="leftBtn">←</button>
  <button id="rightBtn">→</button>
  <button id="toggleIframeInteraction">Toggle iframe Interaction</button>
</div>

<script>
/* ================= iframe URL ================= */
const PAGE_URL = {
  idea: "idea.html",
  analysis: "analysis.html",
  image: "image.html"
};

/* ================= 状態 ================= */
let overlayEnabled = true;
let globalCount = 0;
let centerIndex = 3;

/* ================= カード定義 ================= */
let deck = [
  {id:crypto.randomUUID(), type:'analysis', label:'解析(4)'},
  {id:crypto.randomUUID(), type:'analysis', label:'解析(6)'},
  {id:crypto.randomUUID(), type:'idea',     label:'発想(5)'},
  {id:crypto.randomUUID(), type:'image',    label:'画像'},
  {id:crypto.randomUUID(), type:'analysis', label:'解析(2)'},
  {id:crypto.randomUUID(), type:'idea',     label:'発想(3)'},
  {id:crypto.randomUUID(), type:'idea',     label:'発想(1)'}
];

/* ================= DOM 永続キャッシュ ================= */
const cardDomMap = new Map();

/* ================= util ================= */
function getVisibleIndices(){
  return [
    Math.max(0, centerIndex - 1),
    centerIndex,
    Math.min(deck.length - 1, centerIndex + 1)
  ];
}

/* ================= カード生成（1回だけ） ================= */
function createCard(card){
  if(cardDomMap.has(card.id)) return cardDomMap.get(card.id);

  const el = document.createElement("div");
  el.className = "card";

  const label = document.createElement("div");
  label.className = "card-type";
  label.textContent = card.label;
  el.appendChild(label);

  const wrap = document.createElement("div");
  wrap.className = "iframe-wrap";

  const iframe = document.createElement("iframe");
  iframe.src = PAGE_URL[card.type];

  wrap.appendChild(iframe);
  el.appendChild(wrap);

  const overlay = document.createElement("div");
  overlay.className = "swipe-layer";
  el.appendChild(overlay);

  overlay.addEventListener("pointerdown", e=>{
    overlay.setPointerCapture(e.pointerId);
    overlay.startX = e.clientX;
  });

  overlay.addEventListener("pointerup", e=>{
    const dx = e.clientX - overlay.startX;
    if(Math.abs(dx) > 40){
      handleSwipe(dx, deck.indexOf(card));
    }
  });

  cardDomMap.set(card.id, el);
  return el;
}

/* ================= 描画 ================= */
function render(){
  cardArea.innerHTML = "";

  getVisibleIndices().forEach(i=>{
    const card = deck[i];
    const el = createCard(card);
    el.querySelector(".swipe-layer").style.pointerEvents =
      overlayEnabled ? "auto" : "none";
    cardArea.appendChild(el);
  });
}

/* ================= スワイプ ================= */
function handleSwipe(dist, index){
  const type = dist > 0 ? "idea" : "analysis";
  globalCount++;

  const card = {
    id: crypto.randomUUID(),
    type,
    label: type === "idea"
      ? `発想(${globalCount})`
      : `解析(${globalCount})`
  };

  deck.splice(index + 1, 0, card);
  centerIndex = index + 1;
  render();
}

/* ================= 操作 ================= */
leftBtn.onclick = ()=>{ if(centerIndex>0) centerIndex--; render(); };
rightBtn.onclick = ()=>{ if(centerIndex<deck.length-1) centerIndex++; render(); };

toggleIframeInteraction.onclick = ()=>{
  overlayEnabled = !overlayEnabled;
  render();
};

render();
</script>
</body>
</html>
