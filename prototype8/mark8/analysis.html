<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Dr.Cube AI解析</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: radial-gradient(circle at top left, #0f2027, #203a43, #2c5364);
  font-family: "Segoe UI", "Hiragino Sans", sans-serif;
  color: #fff;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 2em 1em;
}

h1 {
  text-align: center;
  margin-bottom: 1.5em;
}

.card {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(16px);
  border-radius: 16px;
  padding: 1.2em;
  margin-bottom: 1.2em;
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}

.card h2 {
  margin-top: 0;
  font-size: 1.2em;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  padding-bottom: 0.3em;
}

.keywords img {
  width: 100%;
  max-height: 240px;
  object-fit: contain;
  margin-top: 1em;
  border-radius: 12px;
  background: rgba(0,0,0,0.2);
}

.links a {
  display: block;
  color: #00c6ff;
  margin-bottom: 0.4em;
  text-decoration: none;
}
.links a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>
<main>
  <h1>Dr.Cube AI解析レポート</h1>

  <div id="output"></div>
</main>

<script>
const API_URL = "https://dr-cube-1.onrender.com/chat";

/* =========================
   図解・参考マッピング
========================= */
const visualMap = {
  "WebRTC": {
    img: "https://webrtc.org/assets/images/webrtc-diagram.svg",
    youtube: "https://www.youtube.com/watch?v=FExZvpVvYxA"
  },
  "IndexedDB": {
    img: "https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API/Using_IndexedDB/indexeddb.png",
    youtube: "https://www.youtube.com/watch?v=Q7nH8nC3Cjg"
  },
  "AI": {
    img: "https://miro.medium.com/v2/resize:fit:1200/1*eK1v7E3z7u1K7GQ6jP8zDw.png",
    youtube: "https://www.youtube.com/watch?v=ad79nYk2keg"
  }
};

/* =========================
   IndexedDB 読み取り
========================= */
function loadIndexedDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("cardDB", 1);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction("analysis", "readonly");
      const store = tx.objectStore("analysis");
      const getAll = store.getAll();
      getAll.onsuccess = () => resolve(getAll.result);
    };
  });
}

/* =========================
   AI解析を構造化
========================= */
function structureText(text) {
  const sentences = text.split(/。|\n/).filter(Boolean);

  return {
    summary: sentences.slice(0, 2).join("。") + "。",
    explanation: sentences.slice(2).join("。") + "。",
    keywords: Object.keys(visualMap).filter(k => text.includes(k))
  };
}

/* =========================
   表示生成
========================= */
function renderReport(structured) {
  const out = document.getElementById("output");

  // 要点
  out.innerHTML += `
    <div class="card">
      <h2>🔍 要点まとめ</h2>
      <p>${structured.summary}</p>
    </div>
  `;

  // 解説
  out.innerHTML += `
    <div class="card">
      <h2>🧠 解説</h2>
      <p>${structured.explanation}</p>
    </div>
  `;

  // 図解・参考
  structured.keywords.forEach(k => {
    const v = visualMap[k];
    out.innerHTML += `
      <div class="card keywords">
        <h2>📊 図で理解：${k}</h2>
        <img src="${v.img}">
        <div class="links">
          <h3>🎥 参考動画</h3>
          <a href="${v.youtube}" target="_blank">${v.youtube}</a>
        </div>
      </div>
    `;
  });
}

/* =========================
   起動処理
========================= */
window.addEventListener("DOMContentLoaded", async () => {
  const data = await loadIndexedDB();
  if (!data.length) return;

  const latest = data[data.length - 1];

  const res = await fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ message: JSON.stringify(latest) })
  });

  const json = await res.json();
  const structured = structureText(json.reply);
  renderReport(structured);
});
</script>
</body>
</html>
