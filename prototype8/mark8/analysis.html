//画像出力つき
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Dr.Cube AI解析</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: radial-gradient(circle at top left, #0f2027, #203a43, #2c5364);
  font-family: "Segoe UI", "Hiragino Sans", sans-serif;
  color: #fff;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 2em 1em;
}

h1 {
  text-align: center;
  margin-bottom: 1.5em;
}

.card {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(16px);
  border-radius: 16px;
  padding: 1.2em;
  margin-bottom: 1.2em;
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}

.card h2 {
  margin-top: 0;
  font-size: 1.2em;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  padding-bottom: 0.3em;
}

.card img {
  width: 100%;
  max-height: 260px;
  object-fit: contain;
  margin-top: 1em;
  border-radius: 12px;
  background: rgba(0,0,0,0.2);
}

.links a {
  display: inline-block;
  margin-top: 0.6em;
  color: #00c6ff;
  text-decoration: none;
}
.links a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>
<main>
  <h1>Dr.Cube AI解析レポート</h1>
  <div id="output"></div>
</main>

<script>
const API_URL = "https://dr-cube-1.onrender.com/chat";

/* =========================
   IndexedDB 読み取り
========================= */
function loadIndexedDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("cardDB", 1);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction("analysis", "readonly");
      const store = tx.objectStore("analysis");
      const getAll = store.getAll();
      getAll.onsuccess = () => resolve(getAll.result);
    };
  });
}

/* =========================
   解析文を構造化
========================= */
function structureText(text) {
  const sentences = text.split(/。|\n/).filter(Boolean);

  return {
    summary: sentences.slice(0, 2).join("。") + "。",
    explanation: sentences.slice(2).join("。") + "。",
    keywords: extractKeywords(text)
  };
}

/* =========================
   キーワード抽出（軽量・実践向け）
========================= */
function extractKeywords(text) {
  const words = text
    .replace(/[。、]/g, " ")
    .split(/\s+/)
    .filter(w =>
      w.length >= 2 &&
      !["これ", "それ", "ため", "よう", "です", "ます"].includes(w)
    );

  // 出現回数順
  const freq = {};
  words.forEach(w => freq[w] = (freq[w] || 0) + 1);

  return Object.entries(freq)
    .sort((a, b) => b[1] - a[1])
    .map(e => e[0])
    .slice(0, 3);
}

/* =========================
   Wikipedia 画像取得
========================= */
async function fetchWikiVisual(keyword) {
  const url = `https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(keyword)}`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (data.thumbnail && data.thumbnail.source) {
      return {
        title: data.title,
        img: data.thumbnail.source,
        link: data.content_urls.desktop.page
      };
    }
  } catch (e) {
    console.warn("Wikipedia取得失敗:", keyword);
  }
  return null;
}

/* =========================
   表示生成
========================= */
async function renderReport(structured) {
  const out = document.getElementById("output");

  out.innerHTML = `
    <div class="card">
      <h2>🔍 要点まとめ</h2>
      <p>${structured.summary}</p>
    </div>

    <div class="card">
      <h2>🧠 解説</h2>
      <p>${structured.explanation}</p>
    </div>
  `;

  for (const k of structured.keywords) {
    const v = await fetchWikiVisual(k);
    if (!v) continue;

    out.innerHTML += `
      <div class="card">
        <h2>📊 図で理解：${v.title}</h2>
        <img src="${v.img}">
        <div class="links">
          <a href="${v.link}" target="_blank">Wikipediaで詳しく読む</a>
        </div>
      </div>
    `;
  }
}

/* =========================
   起動処理
========================= */
window.addEventListener("DOMContentLoaded", async () => {
  const data = await loadIndexedDB();
  if (!data.length) return;

  const latest = data[data.length - 1];

  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: JSON.stringify(latest) })
  });

  const json = await res.json();
  const structured = structureText(json.reply);
  await renderReport(structured);
});
</script>
</body>
</html>
