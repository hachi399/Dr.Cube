<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3段階連想ブレインストーム（自動生成版）</title>
  <style>
    body{margin:0;font-family:system-ui,Inter,Roboto,sans-serif;background:#fafafa}
    #graph{width:100vw;height:100vh;background:#fff}
    .controls{position:fixed;top:10px;left:10px;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,0.95);padding:8px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.06);z-index:10}
    button{padding:8px 12px;font-size:14px;border-radius:6px;border:none;background:#ff7b50;color:#fff;cursor:pointer}
    button[disabled]{opacity:0.6;cursor:default}
    .tooltip{position:fixed;pointer-events:none;padding:6px 10px;background:rgba(0,0,0,0.85);color:#fff;border-radius:6px;font-size:12px;z-index:10000;display:none;max-width:320px}
  </style>
</head>
<body>

<div class="controls">
  <button id="addSeedBtn">生成（親→子6→孫3×6）</button>
</div>

<input id="seedInput" type="hidden">

<svg id="graph"></svg>
<div id="tooltip" class="tooltip"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>

window.addEventListener('message', e=>{
  if(e.origin !== location.origin) return;
  const { type, payload } = e.data || {};
  if(type === 'DB_UPDATE'){
    const seedText =
      payload?.text ||
      payload?.result ||
      payload?.message ||
      JSON.stringify(payload);

    document.getElementById('seedInput').value = seedText;
    document.getElementById('addSeedBtn').click();
  }
});

let nodes = [];
let links = [];
let idCounter = 0;

const svg = d3.select('#graph');
const tooltip = d3.select('#tooltip');
const getW = () => window.innerWidth;
const getH = () => window.innerHeight;
svg.attr('width', getW()).attr('height', getH());

const LINK_PARENT_CHILD = 45;
const LINK_CHILD_GRAND = 60;

const simulation = d3.forceSimulation()
  .force('link', d3.forceLink().id(d=>d.id).distance(l=>{
    return (l.source.depth===0 && l.target.depth===1)
      ? LINK_PARENT_CHILD : LINK_CHILD_GRAND;
  }))
  .force('charge', d3.forceManyBody().strength(-80))
  .force('center', d3.forceCenter(getW()/2, getH()/2))
  .force('collision', d3.forceCollide(22))
  .on('tick', ticked);

const linkG = svg.append('g');
const nodeG = svg.append('g');

function makeId(){ return 'n'+(++idCounter); }
function findNodeById(id){ return nodes.find(n=>n.id===id); }

const API_URL = "https://dr-cube-1.onrender.com/chat";

async function fetchWords(word, count){
  const res = await fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      message:`「${word}」から連想される短い単語を${count}つ、日本語で出してください。`
    })
  });
  const json = await res.json();
  return String(json.reply||'').split(/[,\n、]/).map(s=>s.trim()).filter(Boolean).slice(0,count);
}

async function fetchReason(a,b){
  const res = await fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:`「${a}」と「${b}」の関係を説明してください。`})
  });
  const json = await res.json();
  return json.reply||'';
}

/* ===========================
   🔧 addNode を拡張（realName）
=========================== */
function addNode(name, parentId=null, depth=0, realName=null){
  const n = {
    id: makeId(),
    name,
    realName: realName || name,
    depth
  };

  const p = parentId && findNodeById(parentId);
  n.x = p?.x || getW()/2;
  n.y = p?.y || getH()/2;

  nodes.push(n);

  if(p){
    const link = {id:'l'+links.length, source:p, target:n, reason:'生成中'};
    links.push(link);
    fetchReason(p.realName, n.realName).then(r=>link.reason=r);
  }
  return n;
}

function restart(){
  linkG.selectAll('g').data(links,d=>d.id)
    .join(enter=>{
      const g=enter.append('g');
      g.append('line').attr('stroke','#bbb').attr('stroke-width',2);
      return g;
    });

  nodeG.selectAll('g').data(nodes,d=>d.id)
    .join(enter=>{
      const g=enter.append('g');
      g.append('circle').attr('r',16).attr('fill','#ffdca8');
      g.append('text').attr('dy',4).attr('text-anchor','middle').style('font-size','11px');
      return g;
    })
    .select('text').text(d=>d.name);

  simulation.nodes(nodes);
  simulation.force('link').links(links);
  simulation.alpha(0.9).restart();
}

function ticked(){
  nodeG.selectAll('g').attr('transform',d=>`translate(${d.x},${d.y})`);
  linkG.selectAll('line')
    .attr('x1',d=>d.source.x)
    .attr('y1',d=>d.source.y)
    .attr('x2',d=>d.target.x)
    .attr('y2',d=>d.target.y);
}

/* ===========================
   ✅ 親ノード一時マスク処理
=========================== */
document.getElementById('addSeedBtn').addEventListener('click', async ()=>{
  const seed = document.getElementById('seedInput').value.trim();
  if(!seed) return;

  nodes=[]; links=[]; idCounter=0;

  // 🔹 表示用は短く、内部は seed
  const parent = addNode('画像から生成', null, 0, seed);
  restart();

  const children = await fetchWords(seed,6);
  for(const c of children){
    const child = addNode(c, parent.id, 1);
    restart();
    const grands = await fetchWords(c,3);
    for(const g of grands){
      addNode(g, child.id, 2);
    }
    restart();
  }

  // 🔹 最後に親ノード表示だけ差し替え
  parent.name = parent.realName;
  restart();
});

</script>
</body>
</html>
