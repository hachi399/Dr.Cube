<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3段階連想ブレインストーム（自動生成版）</title>
  <style>
    body{margin:0;font-family:system-ui,Inter,Roboto,sans-serif;background:#fafafa}
    #graph{width:100vw;height:100vh;background:#fff}
    .controls{
      position:fixed;top:10px;left:10px;
      display:flex;gap:8px;align-items:center;
      background:rgba(255,255,255,0.95);
      padding:8px;border-radius:8px;
      box-shadow:0 6px 18px rgba(0,0,0,0.06);
      z-index:10
    }
    button{
      padding:8px 12px;font-size:14px;
      border-radius:6px;border:none;
      background:#ff7b50;color:#fff;cursor:pointer
    }
    button[disabled]{opacity:0.6;cursor:default}
    .tooltip{
      position:fixed;pointer-events:none;
      padding:6px 10px;
      background:rgba(0,0,0,0.85);
      color:#fff;border-radius:6px;
      font-size:12px;z-index:10000;
      display:none;max-width:320px
    }
  </style>
</head>
<body>

<div class="controls">
  <button id="addSeedBtn">生成（親→子6→孫3×6）</button>
</div>

<input id="seedInput" type="hidden">

<svg id="graph"></svg>
<div id="tooltip" class="tooltip"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>

/* ===============================
   親ページ → 自動生成トリガー
================================ */
window.addEventListener('message', e=>{
  if(e.origin !== location.origin) return;
  const { type, payload } = e.data || {};
  if(type === 'DB_UPDATE'){
    const seedText =
      payload?.text ||
      payload?.result ||
      payload?.message ||
      JSON.stringify(payload);

    document.getElementById('seedInput').value = seedText;
    document.getElementById('addSeedBtn').click();
  }
});

/* ===============================
   D3 基本設定
================================ */
let nodes = [];
let links = [];
let idCounter = 0;

const svg = d3.select('#graph');
const tooltip = d3.select('#tooltip');

const getW = () => window.innerWidth;
const getH = () => window.innerHeight;

svg.attr('width', getW()).attr('height', getH());

const LINK_PARENT_CHILD = 45;
const LINK_CHILD_GRAND = 60;

const simulation = d3.forceSimulation()
  .force('link', d3.forceLink().id(d=>d.id).distance(l=>{
    const s = l.source?.depth ?? 0;
    const t = l.target?.depth ?? 1;
    return (s===0 && t===1) ? LINK_PARENT_CHILD : LINK_CHILD_GRAND;
  }))
  .force('charge', d3.forceManyBody().strength(-80))
  .force('center', d3.forceCenter(getW()/2, getH()/2))
  .force('collision', d3.forceCollide(22))
  .on('tick', ticked);

const linkG = svg.append('g').attr('class','links');
const nodeG = svg.append('g').attr('class','nodes');

function makeId(){ return 'n'+(++idCounter); }
function findNodeById(id){ return nodes.find(n=>n.id===id); }

/* ===============================
   API
================================ */
const API_URL = "https://dr-cube-1.onrender.com/chat";

async function fetchWords(word, count){
  try{
    const res = await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        message:`「${word}」から連想される短い単語を${count}つ、日本語で出してください。`
      })
    });
    const json = await res.json();
    return String(json.reply||'')
      .split(/[,\n、]/)
      .map(s=>s.trim())
      .filter(Boolean)
      .slice(0,count);
  }catch{
    return [];
  }
}

async function fetchReason(a,b){
  try{
    const res = await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        message:`次の2つの概念「${a}」と「${b}」の関連性を2〜3行で説明してください。`
      })
    });
    const json = await res.json();
    return json.reply || '';
  }catch{
    return `${a} → ${b}`;
  }
}

/* ===============================
   addNode（完全統合版）
================================ */
function addNode(name, parentId=null, depth=0, realName=null){
  const n = {
    id: makeId(),
    name,
    realName: realName || name,
    depth
  };

  let px = getW()/2, py = getH()/2;
  if(parentId){
    const p = findNodeById(parentId);
    if(p?.x!=null){ px=p.x; py=p.y; }
  }

  const ang = Math.random()*Math.PI*2;
  const baseDist = parentId ? 40 : 20;
  n.x = px + Math.cos(ang)*baseDist;
  n.y = py + Math.sin(ang)*baseDist;

  nodes.push(n);

  if(parentId){
    const p = findNodeById(parentId);
    const link = {
      id:'l'+links.length,
      source:p,
      target:n,
      reason:'生成中...'
    };
    links.push(link);
    fetchReason(p.realName, n.realName)
      .then(r=>link.reason=r);
  }
  return n;
}

/* ===============================
   restart（元機能完全保持）
================================ */
function restart(){
  const linkSel = linkG.selectAll('g.link').data(links,d=>d.id);
  linkSel.exit().remove();

  const linkEnter = linkSel.enter()
    .append('g')
    .attr('class','link')
    .on('mouseover',(e,d)=>{
      tooltip.style('display','block').text(d.reason);
    })
    .on('mousemove',e=>{
      tooltip.style('left',(e.pageX+10)+'px')
             .style('top',(e.pageY+10)+'px');
    })
    .on('mouseout',()=>tooltip.style('display','none'));

  linkEnter.append('line')
    .attr('class','hit')
    .attr('stroke','transparent')
    .attr('stroke-width',20);

  linkEnter.append('line')
    .attr('class','visible')
    .attr('stroke','#bfbfbf')
    .attr('stroke-width',2);

  const nodeSel = nodeG.selectAll('g.node').data(nodes,d=>d.id);
  nodeSel.exit().remove();

  const nodeEnter = nodeSel.enter().append('g')
    .attr('class','node')
    .on('click',(e,d)=>{
      window.parent.postMessage(
        { type:"SAVE_WORD", payload:d.name },
        location.origin
      );
    });

  nodeEnter.append('circle')
    .attr('r',16)
    .attr('fill','#ffdca8')
    .attr('stroke','#e6a86b')
    .attr('stroke-width',2);

  nodeEnter.append('text')
    .attr('dy',4)
    .attr('text-anchor','middle')
    .style('font-size','11px')
    .text(d=>d.name);

  simulation.nodes(nodes);
  simulation.force('link').links(links);
  simulation.alpha(0.9).restart();
}

/* ===============================
   tick
================================ */
function ticked(){
  nodeG.selectAll('g.node')
    .attr('transform',d=>`translate(${d.x},${d.y})`);

  linkG.selectAll('g.link').each(function(d){
    d3.select(this).select('.hit')
      .attr('x1',d.source.x).attr('y1',d.source.y)
      .attr('x2',d.target.x).attr('y2',d.target.y);
    d3.select(this).select('.visible')
      .attr('x1',d.source.x).attr('y1',d.source.y)
      .attr('x2',d.target.x).attr('y2',d.target.y);
  });
}

/* ===============================
   生成ボタン（1回のみ）
================================ */
document.getElementById('addSeedBtn').addEventListener('click', async ()=>{
  const seed = document.getElementById('seedInput').value.trim();
  if(!seed) return;

  nodes=[]; links=[]; idCounter=0; restart();

  // 親ノード一時マスク
  const parent = addNode('画像から生成', null, 0, seed);
  restart();

  const children = await fetchWords(seed,6);
  for(const c of children){
    const child = addNode(c, parent.id, 1);
    restart();
    const grands = await fetchWords(c,3);
    for(const g of grands){
      addNode(g, child.id, 2);
    }
    restart();
  }

  // 表示だけ元に戻す
  parent.name = parent.realName;
  restart();
});

/* ===============================
   resize
================================ */
window.addEventListener('resize',()=>{
  svg.attr('width',getW()).attr('height',getH());
  simulation.force('center', d3.forceCenter(getW()/2,getH()/2));
  simulation.alpha(0.3).restart();
});
</script>
</body>
</html>
