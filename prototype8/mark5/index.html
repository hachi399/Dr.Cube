<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Swipe Card App — Pattern A Full Fixed</title>

<style>
html,body{height:100%;}
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:system-ui;
  display:flex;
  flex-direction:column;
  align-items:center;
}

#cardArea{
  display:flex;
  width:100vw;
  height:100vh;
}

.card{
  flex:1;
  height:100%;
  background:#333;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.6);
  overflow:hidden;
  position:relative;
  display:none;
  flex-direction:column;
}

.card.visible{ display:flex; }

.card-type{ padding:8px 12px; }

.iframe-wrap{ flex:1; }
iframe{ width:100%; height:100%; border:none; }

.swipe-layer{
  position:absolute;
  inset:0;
  z-index:10;
}

#controls{ margin:12px; }
#log{ font-size:12px; color:#bbb; margin-bottom:8px; }
</style>
</head>
<body>

<div id="cardArea"></div>

<div id="controls">
  <button id="leftBtn">←</button>
  <button id="rightBtn">→</button>
  <button id="toggleIframeInteraction">Toggle iframe Interaction</button>
</div>

<div id="log"></div>

<script>
/* =====================================================
   iframe ⇄ 親ページ通信用
===================================================== */
function sendToIframe(iframe, type, payload){
  if(!iframe || !iframe.contentWindow) return;
  iframe.contentWindow.postMessage({ type, payload }, location.origin);
}

/* ================= IndexedDB ================= */
const DB_NAME = 'cardDB';
const STORE = 'analysis';
let db;

function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE)){
        db.createObjectStore(STORE, { keyPath:'id', autoIncrement:true });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e);
  });
}

function saveResult(data){
  const tx = db.transaction(STORE, 'readwrite');
  tx.objectStore(STORE).add({ time:Date.now(), data });
  tx.oncomplete = ()=>{
    console.log('IndexedDB saved:', data);
    broadcastUpdate(data);
  };
}

function broadcastUpdate(data){
  document.querySelectorAll('iframe').forEach(ifr=>{
    if(ifr.dataset.cardType === 'analysis' || ifr.dataset.cardType === 'idea'){
      ifr.contentWindow.postMessage(
        { type:'DB_UPDATE', payload:data },
        location.origin
      );
    }
  });
}

window.addEventListener('message', event=>{
  if(event.origin !== location.origin) return;
  const { type, payload } = event.data || {};

  if(type === 'IMAGE_RESULT'){
    saveResult(payload);
  }
});

openDB();

const logEl = document.getElementById("log");
function log(msg){ logEl.textContent = msg; console.log(msg); }

/* =====================================================
   アプリ本体
===================================================== */
const PAGE_URL = {
  idea: "idea.html",
  analysis: "analysis.html",
  image: "image_old.html"
};

let overlayEnabled = true;
let globalCount = 0;
let centerIndex = 3;

let deck = [
  {id:crypto.randomUUID(), type:'analysis', label:'解析(4)'},
  {id:crypto.randomUUID(), type:'analysis', label:'解析(6)'},
  {id:crypto.randomUUID(), type:'idea',     label:'発想(5)'},
  {id:crypto.randomUUID(), type:'image',    label:'画像'},
  {id:crypto.randomUUID(), type:'analysis', label:'解析(2)'},
  {id:crypto.randomUUID(), type:'idea',     label:'発想(3)'},
  {id:crypto.randomUUID(), type:'idea',     label:'発想(1)'}
];

const cardArea = document.getElementById("cardArea");
const cardMap = new Map();

/* ===== util ===== */
function getVisibleIndices(){
  const start = Math.max(0, centerIndex - 1);
  const end   = Math.min(deck.length - 1, centerIndex + 2);
  const out=[];
  for(let i=start;i<=end;i++) out.push(i);
  return out;
}

/* ===== 初回のみカード生成 ===== */
function createCard(card){
  const el = document.createElement("div");
  el.className = "card";

  const label = document.createElement("div");
  label.className = "card-type";
  label.textContent = card.label;
  el.appendChild(label);

  const wrap = document.createElement("div");
  wrap.className = "iframe-wrap";

  const iframe = document.createElement("iframe");
  iframe.src = PAGE_URL[card.type];
  iframe.dataset.cardType = card.type;   // ★ 重要
  iframe.dataset.cardId   = card.id;

  iframe.addEventListener('load', ()=>{
    sendToIframe(iframe, 'INIT', { cardType: card.type });
  });

  wrap.appendChild(iframe);
  el.appendChild(wrap);

  const overlay = document.createElement("div");
  overlay.className = "swipe-layer";
  el.appendChild(overlay);

  let startX = 0;
  overlay.addEventListener("pointerdown", e=>{
    overlay.setPointerCapture(e.pointerId);
    startX = e.clientX;
  });

  overlay.addEventListener("pointerup", e=>{
    const dx = e.clientX - startX;
    if(Math.abs(dx) > 40){
      const index = deck.findIndex(d=>d.id===card.id);
      handleSwipe(dx, index);
    }
  });

  cardArea.appendChild(el);
  cardMap.set(card.id, { el, overlay, iframe });
}

/* ===== render（表示制御のみ） ===== */
function render(){
  cardMap.forEach(v=>{
    v.el.classList.remove("visible");
  });

  getVisibleIndices().forEach(i=>{
    const card = deck[i];
    const entry = cardMap.get(card.id);
    if(entry){
      entry.el.classList.add("visible");
      entry.overlay.style.pointerEvents =
        overlayEnabled ? "auto" : "none";
    }
  });
}

/* ===== swipe ===== */
function handleSwipe(dist, index){
  const type = dist > 0 ? "idea" : "analysis";
  globalCount++;

  const card = {
    id: crypto.randomUUID(),
    type,
    label: type==="idea"
      ? `発想(${globalCount})`
      : `解析(${globalCount})`
  };

  deck.splice(index + 1, 0, card);
  createCard(card);
  centerIndex = index + 1;
  render();
}

/* ===== 初期化 ===== */
deck.forEach(createCard);
render();

/* ===== controls ===== */
leftBtn.onclick = ()=>{
  if(centerIndex>0){ centerIndex--; render(); }
};
rightBtn.onclick = ()=>{
  if(centerIndex<deck.length-1){ centerIndex++; render(); }
};
toggleIframeInteraction.onclick = ()=>{
  overlayEnabled = !overlayEnabled;
  render();
};
</script>
</body>
</html>
