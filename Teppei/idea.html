<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Idea Frame</title>
<style>
body {
  margin: 0;
  background: #1e1e1e;
  color: white;
  font-family: system-ui;
}
#log {
  padding: 12px;
}
</style>
</head>

<body>
<h2>💡 IDEA FRAME</h2>
<div id="log">起動中...</div>

<script>
/* =========================
   ① iframe 起動と同時に実行
========================= */
console.log("idea.html boot");

const log = msg => {
  document.getElementById("log").innerHTML += `<div>${msg}</div>`;
};

log("iframe 自動起動 OK");

/* =========================
   ② 親からのデータを受信
========================= */
window.addEventListener("message", e => {
  if (e.origin !== location.origin) return;

  const { type, payload } = e.data || {};

  if (type === "INIT") {
    log("INIT 受信: " + JSON.stringify(payload));
  }

  if (type === "DB_UPDATE") {
    log("DB_UPDATE 受信");
    log(JSON.stringify(payload));
  }
});

/* =========================
   ③ 親に「即起動完了」を通知
========================= */
window.parent.postMessage(
  { type: "IFRAME_READY", frame: "idea" },
  location.origin
);
</script>
</body>
</html>
