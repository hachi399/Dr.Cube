<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Idea Frame</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fafafa;
      font-family: system-ui, sans-serif;
    }

    #graph {
      width: 100vw;
      height: 100vh;
    }

    .controls {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255,255,255,0.95);
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    }

    button {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: #ff7b50;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="controls">
  <button id="generateBtn">再生成</button>
</div>

<input type="hidden" id="seedInput">

<svg id="graph"></svg>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
/* =====================================================
   設定
===================================================== */
const API_URL = "https://dr-cube-1.onrender.com/chat";

/* =====================================================
   状態
===================================================== */
let initialized = false;
let nodes = [];
let links = [];
let idCounter = 0;

/* =====================================================
   SVG & D3
===================================================== */
const svg = d3.select("#graph");
const width = () => window.innerWidth;
const height = () => window.innerHeight;

const linkG = svg.append("g");
const nodeG = svg.append("g");

const simulation = d3.forceSimulation()
  .force("link", d3.forceLink().id(d => d.id).distance(70))
  .force("charge", d3.forceManyBody().strength(-140))
  .force("center", d3.forceCenter(width() / 2, height() / 2))
  .on("tick", ticked);

/* =====================================================
   親との通信
===================================================== */
let cardId = null;

window.addEventListener("message", e => {
  //if (e.origin !== location.origin) return;

  const { type, payload } = e.data || {};

  if (type === "INIT") {
    initialized = true;
    cardId = payload.cardId;
    setup();
  }

  if (type === "START_IDEA") {

  if (!initialized) {
    console.log("⏳ INIT待ち");
    return;
  }

  cardId = payload.cardId;

  const seed = payload.text?.trim() || "発想";

  document.getElementById("seedInput").value = seed;
  generate();
}

 if (type === "RESTORE_STRUCTURE") {
  nodes = payload.structure.nodes.map(n => ({ ...n }));

  links = payload.structure.links.map(l => ({
    source: typeof l.source === "object" ? l.source.id : l.source,
    target: typeof l.target === "object" ? l.target.id : l.target
  }));

  restart();
}



});

/* =====================================================
   API：連想語取得
===================================================== */
async function fetchWords(word, count = 6) {
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: `「${word}」から連想される短い単語を${count}つ、日本語で出してください。出力は単語のみ、改行かカンマで区切ってください。より突飛な連想でよろしく`
      })
    });

    const json = await res.json();

    const text =
      typeof json.reply === "string" ? json.reply :
      typeof json.message === "string" ? json.message :
      typeof json.text === "string" ? json.text : "";

    return text
      .split(/[,\u3001\n]+/)
      .map(s => s.trim())
      .filter(Boolean)
      .slice(0, count);

  } catch (err) {
    console.error("fetchWords error", err);
    return [];
  }
}

/* =====================================================
   ノード生成
===================================================== */
function makeId() {
  return "n" + (++idCounter);
}

function addNode(name, parent = null) {
  const node = {
    id: makeId(),
    name,
    x: width() / 2 + Math.random() * 40,
    y: height() / 2 + Math.random() * 40
  };

  nodes.push(node);

  if (parent) {
    links.push({
      source: parent.id,
      target: node.id
    });
  }

  return node;
}

/* =====================================================
   再描画
===================================================== */
function restart() {
  const link = linkG.selectAll("line")
    .data(links);

  link.exit().remove();

  link.enter()
    .append("line")
    .attr("stroke", "#bbb")
    .merge(link);

  const node = nodeG.selectAll("g")
    .data(nodes, d => d.id);

  node.exit().remove();

  const enter = node.enter()
    .append("g");

  enter.append("circle")
    .attr("r", d => d.id === "n1" ? 22 : 16)
    .attr("fill", d => d.id === "n1" ? "#ffb347" : "#ffdca8");

  enter.append("text")
  .attr("y", 4)
  .attr("text-anchor", "middle")
  .attr("font-size", "11px")
  .text(d => d.name.length > 20 ? d.name.slice(0,20) + "…" : d.name);


  simulation.nodes(nodes);
  simulation.force("link").links(links);
  simulation.alpha(1).restart();
}

function ticked() {
  nodeG.selectAll("g")
    .attr("transform", d => `translate(${d.x},${d.y})`);

  linkG.selectAll("line")
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x)
    .attr("y2", d => d.target.y);
}

/* =====================================================
   三段連想生成（親→子→孫）
===================================================== */
async function generate() {
  const seed = document.getElementById("seedInput").value.trim();
  if (!seed) return;

  nodes = [];
  links = [];
  idCounter = 0;

  const root = addNode(seed);

  const children = await fetchWords(seed, 5);

  for (const childWord of children) {
    const childNode = addNode(childWord, root);

    const grandchildren = await fetchWords(childWord, 3);
    for (const grandWord of grandchildren) {
      addNode(grandWord, childNode);
    }
  }

  restart();

  window.parent.postMessage({
  type: "IDEA_RESULT",
  payload: {
    cardId,
    result: seed,
    structure: {
      nodes,
      links
    }
  }
}, location.origin);

if (!cardId) {
  console.warn("cardId未設定");
  return;
}


}

/* =====================================================
   UI
===================================================== */
document.getElementById("generateBtn")
  .addEventListener("click", generate);

function setup() {
  svg.attr("width", width()).attr("height", height());

  window.addEventListener("resize", () => {
    svg.attr("width", width()).attr("height", height());
    simulation.force("center", d3.forceCenter(width()/2, height()/2));
    simulation.alpha(0.3).restart();
  });
}

window.parent.postMessage(
  { type: "IFRAME_READY" },
  location.origin
);

</script>
</body>
</html>
