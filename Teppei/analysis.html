<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Analysis Frame</title>
<style>
body {
  margin: 0;
  background: #121212;
  color: #fff;
  font-family: system-ui;
}
#result {
  padding: 12px;
}
</style>
</head>

<body>
<h2>🧠 ANALYSIS FRAME</h2>
<div id="result">起動中...</div>

<script>
console.log("analysis.html boot");

const out = t => {
  document.getElementById("result").innerHTML += `<div>${t}</div>`;
};

out("iframe 自動起動 OK");

/* 親からの解析要求 */
window.addEventListener("message", e => {
  if (e.origin !== location.origin) return;

  const { type, payload } = e.data || {};

  if (type === "INIT") {
    out("INIT 受信");
  }

  if (type === "ANALYSIS_REQUEST") {
    out("解析要求受信");
    out(JSON.stringify(payload));

    // 親へ返す
    parent.postMessage({
      type: "ANALYSIS_RESULT",
      payload: "解析完了"
    }, location.origin);
  }
});

/* 即 READY */
parent.postMessage(
  { type: "IFRAME_READY", frame: "analysis" },
  location.origin
);
</script>
</body>
</html>
