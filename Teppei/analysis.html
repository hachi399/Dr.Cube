<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Analysis Frame</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(circle at top left, #0f2027, #203a43, #2c5364);
      font-family: "Segoe UI", "Hiragino Sans", sans-serif;
      color: #fff;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5em;
      height: 100%;
      box-sizing: border-box;
    }

    #chat {
      width: 90%;
      max-width: 700px;
      flex: 1;
      overflow-y: auto;
      padding: 1em;
      background: rgba(255,255,255,0.12);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      margin-bottom: 1em;
    }

    .controls {
      display: flex;
      width: 90%;
      max-width: 700px;
      gap: 0.5em;
    }

    input {
      flex: 1;
      padding: 0.6em;
      border-radius: 8px;
      border: none;
      font-size: 1em;
    }

    button {
      padding: 0.6em 1em;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
<main>
  <h2>AI 解析フレーム</h2>

  <div id="chat">
    <p>解析待機中…</p>
  </div>

  <div class="controls">
    <input id="input" placeholder="手動解析メッセージ…" />
    <button id="sendBtn">送信</button>
  </div>
</main>
<script>
/* =====================================================
   状態
===================================================== */
let initialized = false;
let cardId = null;
let cardType = null;

const API_URL = "https://dr-cube-1.onrender.com/chat";

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");

/* =====================================================
   親との通信
===================================================== */
let executed = false;

window.addEventListener("message", e => {
  if (e.origin !== location.origin) return;

  const { type, payload } = e.data || {};

  if (type === "START_ANALYSIS") {
    if (!cardId) {
      log("⏳ INIT待ち");
      return;
    }
    if (executed) return;
    executed = true;

    analyze(payload.text || "内容を解析してください");
  }

});

/* =====================================================
   UI & AI
===================================================== */
function log(text) {
  chatEl.innerHTML += `<p>${text}</p>`;
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function analyze(message) {
  log(`<b>解析対象:</b> ${message}`);

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message })
    });

    const data = await res.json();
    log(`<b>AI解析:</b> ${data.reply}`);

    parent.postMessage({
      type: "ANALYSIS_RESULT",
      payload: {
        cardId,
        result: data.reply
      }
    }, location.origin);

  } catch (err) {
    log("❌ 解析エラー");
    console.error(err);
  }
}

/* =====================================================
   手動解析（cardId無関係）
===================================================== */
document.getElementById("sendBtn").addEventListener("click", () => {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  analyze(text);
});

/* =====================================================
   iframe準備完了
===================================================== */
window.parent.postMessage(
  { type: "IFRAME_READY" },
  location.origin
);

</script>
</body>
</html>
