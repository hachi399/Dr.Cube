<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swipe Card App</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #111;
      color: #fff;
      font-family: system-ui;
    }

    #cardArea {
      display: flex;
      width: 100vw;
      height: calc(100vh - 60px);
    }

    .card {
      flex: 1;
      height: 100%;
      display: none;
      flex-direction: column;
      background: #333;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,.6);
      overflow: hidden;
      position: relative;
    }

    .card.visible {
      display: flex;
    }

    .card-type {
      padding: 8px 12px;
    }

    .iframe-wrap {
      flex: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .swipe-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: none;
    }

    #controls {
      padding: 10px;
    }
  </style>
</head>

<body>

<div id="cardArea"></div>

<div id="controls">
  <button id="leftBtn">←</button>
  <button id="rightBtn">→</button>
</div>
<div id="log" style="padding:6px;font-size:12px;opacity:.6"></div>

<script>
/* =====================================================
   設定
===================================================== */
const PAGE_URL = {
  idea: "idea.html",
  analysis: "analysis.html",
  image: "image.html"
};

let overlayEnabled = false;
let centerIndex = 3;
let globalCount = 0;

/* =====================================================
   データ
===================================================== */
let uid = 0;
const genId = () => "card-" + uid++;

const deck = [
  { id: genId(), type: 'analysis', label: '解析(4)' },
  { id: genId(), type: 'analysis', label: '解析(6)' },
  { id: genId(), type: 'idea', label: '発想(5)' },
  { id: genId(), type: 'image', label: '画像' },
  { id: genId(), type: 'analysis', label: '解析(2)' },
  { id: genId(), type: 'idea', label: '発想(3)' },
  { id: genId(), type: 'idea', label: '発想(1)' }
];

const cardArea = document.getElementById("cardArea");
const cardMap = new Map();

/* =====================================================
   util
===================================================== */
function getVisibleIndices() {
  const start = Math.max(0, centerIndex - 1);
  const end = Math.min(deck.length - 1, centerIndex + 1);
  return Array.from({ length: end - start + 1 }, (_, i) => start + i);
}

function sendToIframe(iframe, type, payload) {
  iframe.contentWindow?.postMessage({ type, payload }, location.origin);
}

/* =====================================================
   カード生成
===================================================== */
function createCard(card) {
  const el = document.createElement("div");
  el.className = "card";
  el.dataset.cardId = card.id;

  const label = document.createElement("div");
  label.className = "card-type";
  label.textContent = card.label;

  const wrap = document.createElement("div");
  wrap.className = "iframe-wrap";

  const iframe = document.createElement("iframe");
  iframe.src = PAGE_URL[card.type];
  iframe.dataset.cardId = card.id;
  iframe.dataset.cardType = card.type;

  const overlay = document.createElement("div");
  overlay.className = "swipe-layer";

  let startX = 0;

  el.addEventListener("pointerdown", e => {
    startX = e.clientX;
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener("pointerup", e => {
    const dist = e.clientX - startX;
    if (Math.abs(dist) > 80) {
      const index = deck.findIndex(c => c.id === card.id);
      if (index !== -1) handleSwipe(dist, index);
    }
  });

  iframe.onload = () => {
    iframe.contentWindow.postMessage({
      type: "INIT",
      payload: { cardType: card.type }
    }, location.origin);
  };

  wrap.appendChild(iframe);
  el.append(label, wrap, overlay);
  cardArea.appendChild(el);

  cardMap.set(card.id, { el, iframe, overlay });
}

/* =====================================================
   render
===================================================== */
function render() {
  cardMap.forEach(v => v.el.classList.remove("visible"));

  getVisibleIndices().forEach(i => {
    const entry = cardMap.get(deck[i].id);
    if (!entry) return;

    entry.el.classList.add("visible");
    entry.overlay.style.display = overlayEnabled ? "block" : "none";
  });
}

/* =====================================================
   swipe 処理
===================================================== */

function handleSwipe(dist, index) {
  const type = dist > 0 ? "idea" : "analysis";
  globalCount++;

  const card = {
    id: genId(),
    type,
    label: type === "idea" ? `発想(${globalCount})` : `解析(${globalCount})`
  };

  deck.splice(index + 1, 0, card);
  createCard(card);

  centerIndex = index + 1;
  render();
}

/* ================= IndexedDB ================= */
const DB_NAME = 'cardDB';
const STORE = 'analysis';
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);

    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        db.createObjectStore(STORE, {
          keyPath: 'id',
          autoIncrement: true
        });
      }
    };

    req.onsuccess = e => {
      db = e.target.result;
      resolve(db);
    };

    req.onerror = e => reject(e);
  });
}

/* ===== 保存処理（sourceWindow に結果を返す） ===== */
function saveResult(data, sourceWindow) {
  if (!db) return;

  const tx = db.transaction(STORE, 'readwrite');
  const store = tx.objectStore(STORE);

  store.add({
    time: Date.now(),
    data
  });

  tx.oncomplete = () => {
    sourceWindow?.postMessage(
      { type: 'SAVE_SUCCESS', payload: data },
      location.origin
    );

    broadcastUpdate(data, sourceWindow); // ★ sourceWindow を渡す
  };

  tx.onerror = () => {
    sourceWindow?.postMessage(
      { type: 'SAVE_ERROR', error: 'IndexedDB error' },
      location.origin
    );
  };
}

/* ===== idea / analysis iframe へ一斉通知 ===== */
function broadcastUpdate(data, sourceWindow) {
  document.querySelectorAll("iframe").forEach(ifr => {
    if (ifr.contentWindow === sourceWindow) return; // 🔥 自分には返さない

    const type = ifr.dataset.cardType;
    if (type === "analysis" || type === "idea") {
      ifr.contentWindow.postMessage(
        { type: "DB_UPDATE", payload: data },
        location.origin
      );
    }
  });
}


/* ================= iframe からの結果受信 ================= */
window.addEventListener("message", event => {
  if (event.origin !== location.origin) return;

  const { type, payload } = event.data || {};

  const allowedTypes = [
    "IMAGE_RESULT",
    "IDEA_RESULT",
    "ANALYSIS_RESULT"
  ];

  if (allowedTypes.includes(type)) {
    saveResult(payload, event.source);
  }

  function showSuccessAlert(payload) {
    console.log("保存成功:", payload);
  }

  if (type === "SAVE_SUCCESS") {
    showSuccessAlert(payload);
  }
});

/* =====================================================
   iframe → 親 通信
===================================================== */
window.addEventListener("message", e => {
  if (e.origin !== location.origin) return;

  if (e.data?.type === "IFRAME_READY") {
    const entry = [...cardMap.values()]
      .find(v => v.iframe.contentWindow === e.source);

    if (!entry) return;

    const cardType = entry.iframe.dataset.cardType;

    entry.iframe.contentWindow.postMessage({
      type: "INIT",
      payload: { cardType }
    }, location.origin);
  }
});


/* =====================================================
   初期化
===================================================== */
deck.forEach(createCard);
render();

document.getElementById("leftBtn").onclick = () => {
  if (centerIndex > 0) centerIndex--, render();
};

document.getElementById("rightBtn").onclick = () => {
  if (centerIndex < deck.length - 1) centerIndex++, render();
};

openDB().then(() => log("IndexedDB ready"));

/* ================= ログ ================= */
const logEl = document.getElementById("log");
function log(msg) {
  if (logEl) logEl.textContent = msg;
  console.log(msg);
}
</script>
</body>
</html>
