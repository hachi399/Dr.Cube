<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>サンプルHTML</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #4CAF50;
      color: white;
      padding: 16px;
      text-align: center;
    }
    main {
      padding: 20px;
    }
    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>こんにちは！</h1>
    <p>これは適当なHTMLのサンプルです</p>
  </header>

  <main>
    <h2>内容</h2>
    <p>HTML・CSS・JavaScriptの基本構造を含んでいます。</p>

    <button onclick="sayHello()">クリックしてね</button>
  </main>

  <script>
    function sayHello() {
      alert("Hello, World!");
    }
  </script>

</body>
</html>
