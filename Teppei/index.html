<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swipe Card App</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #111;
      color: #fff;
      font-family: system-ui;
    }

    #cardArea {
      display: flex;
      width: 100vw;
      height: calc(100vh - 60px);
    }

    .card {
      flex: 1;
      height: 100%;
      display: none;
      flex-direction: column;
      background: #333;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,.6);
      overflow: hidden;
      position: relative;
    }

    .card.visible {
      display: flex;
    }

    .card-type {
      padding: 8px 12px;
    }

    .iframe-wrap {
      flex: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .swipe-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: none;
    }

    #controls {
      padding: 10px;
    }
  </style>
</head>

<body>

<div id="cardArea"></div>

<div id="controls">
  <button id="leftBtn">←</button>
  <button id="rightBtn">→</button>
  <div id="log" style="padding:6px;font-size:12px;opacity:.6"></div>
</div>

<script>
/* =====================================================
   設定
===================================================== */
const PAGE_URL = {
  idea: "idea.html",
  analysis: "analysis.html",
  image: "image.html"
};

let overlayEnabled = false;
let centerIndex = 0;
let globalCount = 0;

let analysisCount = 0;
let ideaCount = 0;

function resetChildCounters() {
  analysisCount = 0;
  ideaCount = 0;
}

/* =====================================================
   データ
===================================================== */
let uid = 0;
const genId = () => "card-" + uid++;

const deck = [
  { id: genId(), type: 'image', label: '画像' }
];


const cardArea = document.getElementById("cardArea");
const cardMap = new Map();
const executedMap = new Map(); // cardId -> true

/* =====================================================
   util
===================================================== */
function getVisibleIndices() {
  const start = Math.max(0, centerIndex - 1);
  const end = Math.min(deck.length - 1, centerIndex + 1);
  return Array.from({ length: end - start + 1 }, (_, i) => start + i);
}

function sendToIframe(iframe, type, payload) {
  iframe.contentWindow?.postMessage({ type, payload }, location.origin);
}

function startImage(card) {
  const entry = cardMap.get(card.id);
  if (!entry) return;

  entry.iframe.contentWindow.postMessage({
    type: "START_IMAGE",
    payload: {
      cardId: card.id
    }
  }, location.origin);
}

function spawnFromCard(sourceCard) {
  const parentIndex = deck.findIndex(c => c.id === sourceCard.id);

  const newCard = {
    id: genId(),
    type: sourceCard.type,
    parentId: sourceCard.parentId,
    label:
      sourceCard.type === "analysis"
        ? `解析(${++analysisCount})`
        : `発想(${++ideaCount})`,
    sourceText: sourceCard.sourceText
  };

  deck.splice(parentIndex + 1, 0, newCard);
  createCard(newCard);
  render();

  const entry = cardMap.get(newCard.id);
  sendToIframe(
    entry.iframe,
    sourceCard.type === "analysis"
      ? "START_ANALYSIS"
      : "START_IDEA",
    {
      cardId: newCard.id,
      text: sourceCard.sourceText
    }
  );
}

/* =====================================================
   カード生成
===================================================== */
  function startAnalysis(card) {
  const entry = cardMap.get(card.id);
  if (!entry) return;

  const imageText = imageResultMap.get(card.id);

  entry.iframe.contentWindow.postMessage({
    type: "START_ANALYSIS",
    payload: {
      cardId: card.id,
      text: imageText ?? "画像生成結果がまだありません"
    }
  }, location.origin);
}
function createCard(card) {
  const el = document.createElement("div");
  el.className = "card";
  el.dataset.cardId = card.id;
  el.setAttribute("draggable", true);

  el.addEventListener("dragstart", e => {
    e.preventDefault();
  });

  const label = document.createElement("div");
  label.className = "card-type";
  label.textContent = card.label;

  const wrap = document.createElement("div");
  wrap.className = "iframe-wrap";

  const iframe = document.createElement("iframe");
  iframe.src = PAGE_URL[card.type];
  iframe.dataset.cardId = card.id;
  iframe.dataset.cardType = card.type;

  iframe.onload = () => {
    iframe.contentWindow.postMessage({
      type: "INIT",
      payload: { cardId: card.id }
    }, location.origin);
  };

  const overlay = document.createElement("div");
  overlay.className = "swipe-layer";

  let startX = 0;

  el.addEventListener("pointerdown", e => {
    startX = e.clientX;
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener("pointerup", e => {
    const dist = e.clientX - startX;
    if (Math.abs(dist) < 40) return;

    if (card.type === "image") return;

    spawnFromCard(card);
  });

  wrap.appendChild(iframe);
  el.append(label, wrap, overlay);
  cardArea.appendChild(el);

  cardMap.set(card.id, { el, iframe, overlay });
}

/* =====================================================
   render
===================================================== */

  function getImageIndex() {
  return deck.findIndex(c => c.type === "image");
}

function render() {
  const imageIndex = getImageIndex();
  if (imageIndex !== -1) {
    centerIndex = imageIndex;
  }

  cardMap.forEach(v => v.el.classList.remove("visible"));

  getVisibleIndices().forEach(i => {
    const card = deck[i];
    const entry = cardMap.get(card.id);
    if (!entry) return;

    entry.el.classList.add("visible");

    if (card.type === "image") {
      startImage(card);
    }
  });
}



/* =====================================================
   swipe 処理
===================================================== */
function handleSwipe(dist, index) {
  const parent = deck[index];
  
  if (parent.type === "image") return;
  const type = parent.type; // ← 親と同じタイプだけ生成

  const card = {
  id: genId(),
  type,
  parentId: parent.id,
  label: type === "idea"
    ? `発想(${++ideaCount})`
    : `解析(${++analysisCount})`,
  sourceText: parent.sourceText
};


  deck.splice(index + 1, 0, card);
  createCard(card);
  render();
}

/* ================= IndexedDB ================= */
const DB_NAME = 'cardDB';
const STORE = 'analysis';
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);

    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        db.createObjectStore(STORE, {
          keyPath: 'id',
          autoIncrement: true
        });
      }
    };

    req.onsuccess = e => {
      db = e.target.result;
      resolve(db);
    };

    req.onerror = e => reject(e);
  });
}

/* ===== 保存処理（sourceWindow に結果を返す） ===== */
function saveResult(data, sourceWindow) {
  if (!db) return;

  const tx = db.transaction(STORE, 'readwrite');
  const store = tx.objectStore(STORE);

  store.add({
    time: Date.now(),
    data
  });

  tx.oncomplete = () => {
    sourceWindow?.postMessage(
      { type: 'SAVE_SUCCESS', payload: data },
      location.origin
    );

    broadcastUpdate(data, sourceWindow); // ★ sourceWindow を渡す
  };

  tx.onerror = () => {
    sourceWindow?.postMessage(
      { type: 'SAVE_ERROR', error: 'IndexedDB error' },
      location.origin
    );
  };
}

/* ===== idea / analysis iframe へ一斉通知 ===== */
function broadcastUpdate(payload, sourceWindow) {
  document.querySelectorAll("iframe").forEach(ifr => {
    if (ifr.contentWindow === sourceWindow) return;

    const type = ifr.dataset.cardType;
    if (type === "analysis" || type === "idea") {
      ifr.contentWindow.postMessage(
        {
          type: "DB_UPDATE",
          payload
        },
        location.origin
      );
    }
  });
}

/* ================= iframe からの結果受信 ================= */
const imageResultMap = new Map(); // cardId -> text
  
window.addEventListener("message", event => {
  if (event.origin !== location.origin) return;

  const { type, payload } = event.data || {};
  if (!type) return;

  /* ===== analysis 結果受信 ===== */
if (type === "ANALYSIS_RESULT") {
  const { cardId, result } = payload;

  log(`📥 解析結果受信: ${cardId}`);

  // 保存
  saveResult(
    { cardId, result, type: "analysis" },
    event.source
  );

  // 🔥 次ノード自動生成（例：idea）
  const parentIndex = deck.findIndex(c => c.id === cardId);
  if (parentIndex !== -1) {
    const card = {
      id: genId(),
      type: "idea",
      parentId: cardId,
      label: `発想(${++globalCount})`,
      sourceText: result
    };

    deck.splice(parentIndex + 1, 0, card);
    createCard(card);
    render();
  }
}


  /* ===== image → text 完了 ===== */
if (type === "IMAGE_TEXT_READY") {

  resetChildCounters();

  imageResultMap.set(payload.cardId, payload.text);

  const imageIndex = deck.findIndex(c => c.id === payload.cardId);
  if (imageIndex !== -1) {
    centerIndex = imageIndex;
  }

  let children = deck.filter(c => c.parentId === payload.cardId);

  if (children.length === 0) {

    const parentIndex = deck.findIndex(c => c.id === payload.cardId);

    ["idea", "analysis"].forEach((t, i) => {
      const card = {
        id: genId(),
        type: t,
        parentId: payload.cardId,
        label: t === "idea"
          ? `発想(${++ideaCount})`
          : `解析(${++analysisCount})`,
        sourceText: payload.text
      };

      deck.splice(parentIndex + 1 + i, 0, card);
      createCard(card);
    });

    render();

    // 再取得
    children = deck.filter(c => c.parentId === payload.cardId);
  }

  // ★ ここをブロック内に置くのが重要
  children.forEach(c => {

    if (executedMap.get(c.id)) return;
    executedMap.set(c.id, true);

    const entry = cardMap.get(c.id);
    if (!entry) return;

    const msgType =
      c.type === "idea" ? "START_IDEA" : "START_ANALYSIS";

    sendToIframe(entry.iframe, msgType, {
      cardId: c.id,
      text: payload.text
    });

  });

}

});

/* =====================================================
   iframe → 親 通信
===================================================== */


/* =====================================================
   初期化
===================================================== */
deck.forEach(createCard);
render();

document.getElementById("leftBtn").onclick = () => {
  if (centerIndex > 0) centerIndex--, render();
};

document.getElementById("rightBtn").onclick = () => {
  if (centerIndex < deck.length - 1) centerIndex++, render();
};

openDB().then(() => log("IndexedDB ready"));

/* ================= ログ ================= */
const logEl = document.getElementById("log");
function log(msg) {
  if (logEl) logEl.textContent = msg;
  console.log(msg);
}
</script>
</body>
</html>
