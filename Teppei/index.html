<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swipe Card App</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #111;
      color: #fff;
      font-family: system-ui;
    }

    #cardArea {
      display: flex;
      width: 100vw;
      height: calc(100vh - 60px);
    }

    .card {
      flex: 1;
      display: none;
      flex-direction: column;
      background: #333;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,.6);
      overflow: hidden;
      position: relative;
    }

    .card.visible {
      display: flex;
    }

    .card-type {
      padding: 8px 12px;
    }

    .iframe-wrap {
      flex: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .swipe-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: none;
    }

    #controls {
      padding: 10px;
    }
  </style>
</head>

<body>

<div id="cardArea"></div>

<div id="controls">
  <button id="leftBtn">←</button>
  <button id="rightBtn">→</button>
</div>

<script>
/* =====================================================
   設定
===================================================== */
const PAGE_URL = {
  idea: "idea.html",
  analysis: "analysis.html",
  image: "image.html"
};

let overlayEnabled = false;
let centerIndex = 3;
let globalCount = 0;

/* =====================================================
   データ
===================================================== */
let uid = 0;
const genId = () => "card-" + uid++;

const deck = [
  { id: genId(), type: 'analysis', label: '解析(4)' },
  { id: genId(), type: 'analysis', label: '解析(6)' },
  { id: genId(), type: 'idea', label: '発想(5)' },
  { id: genId(), type: 'image', label: '画像' },
  { id: genId(), type: 'analysis', label: '解析(2)' },
  { id: genId(), type: 'idea', label: '発想(3)' },
  { id: genId(), type: 'idea', label: '発想(1)' }
];

const cardArea = document.getElementById("cardArea");
const cardMap = new Map();

/* =====================================================
   util
===================================================== */
function getVisibleIndices() {
  const start = Math.max(0, centerIndex - 1);
  const end = Math.min(deck.length - 1, centerIndex + 1);
  return Array.from({ length: end - start + 1 }, (_, i) => start + i);
}

function sendToIframe(iframe, type, payload) {
  iframe.contentWindow?.postMessage({ type, payload }, location.origin);
}

/* =====================================================
   カード生成
===================================================== */
function createCard(card) {
  console.log("createCard:", card);
  
  
  
  const el = document.createElement("div");
  el.className = "card";
  el.dataset.index = deck.indexOf(card);

  const label = document.createElement("div");
  label.className = "card-type";
  label.textContent = card.label;

  const wrap = document.createElement("div");
  wrap.className = "iframe-wrap";

  const iframe = document.createElement("iframe");
        iframe.srcdoc =  `
          <html>
            <body style="background:#222;color:white">
              <h1>${card.label}</h1>
            </body>
          </html>
        `;
  iframe.dataset.cardId = card.id;

  iframe.onload = () => {
    sendToIframe(iframe, "INIT", { cardType: card.type });
  };

  const overlay = document.createElement("div");
  overlay.className = "swipe-layer";

  let startX = 0;

el.addEventListener("pointerdown", e => {
  startX = e.clientX;
  el.setPointerCapture(e.pointerId);
});

el.addEventListener("pointerup", e => {
  const dist = e.clientX - startX;

  if (Math.abs(dist) > 80) {
    const index = deck.findIndex(c => c.id === card.id);
    if (index !== -1) {
      handleSwipe(dist, index);
    }
  }
});


  wrap.appendChild(iframe);
  el.append(label, wrap, overlay);
  cardArea.appendChild(el);

  cardMap.set(card.id, { el, iframe, overlay });
}

/* =====================================================
   render
===================================================== */
function render() {
  cardMap.forEach(v => v.el.classList.remove("visible"));

  getVisibleIndices().forEach(i => {
    const entry = cardMap.get(deck[i].id);
    if (!entry) return;

    entry.el.classList.add("visible");
    entry.overlay.style.display = overlayEnabled ? "block" : "none";
  });
}

/* =====================================================
   swipe 処理
===================================================== */

function handleSwipe(dist, index) {
  const type = dist > 0 ? "idea" : "analysis";
  globalCount++;

  const card = {
    id: genId(),
    type,
    label: type === "idea" ? `発想(${globalCount})` : `解析(${globalCount})`
  };

  deck.splice(index + 1, 0, card);
  createCard(card);

  centerIndex = index + 1;
  render();
}

/* =====================================================
   iframe → 親 通信
===================================================== */
window.addEventListener("message", e => {
  if (e.origin !== location.origin) return;

  if (e.data.type === "IFRAME_SWIPE") {
    const iframe = [...document.querySelectorAll("iframe")]
      .find(f => f.contentWindow === e.source);

    if (!iframe) return;

    const index = deck.findIndex(c => c.id === iframe.dataset.cardId);
    if (index !== -1) handleSwipe(e.data.dist, index);
  }
});

/* =====================================================
   初期化
===================================================== */
deck.forEach(createCard);
render();

document.getElementById("leftBtn").onclick = () => {
  if (centerIndex > 0) centerIndex--, render();
};

document.getElementById("rightBtn").onclick = () => {
  if (centerIndex < deck.length - 1) centerIndex++, render();
};
</script>
</body>
</html>
