<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swipe Card App</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #111;
      color: #fff;
      font-family: system-ui;
    }

    #cardArea {
      display: flex;
      width: 100vw;
      height: calc(100vh - 60px);
    }

    .card {
      flex: 1;
      height: 100%;
      display: none;
      flex-direction: column;
      background: #333;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,.6);
      overflow: hidden;
      position: relative;
    }

    .card.visible {
      display: flex;
    }

    .card-type {
      padding: 8px 12px;
    }

    .iframe-wrap {
      flex: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .swipe-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: none;
    }

    #controls {
      padding: 10px;
    }
  </style>
</head>

<body>

<div id="cardArea"></div>

<div id="controls">
  <button id="leftBtn">←</button>
  <button id="rightBtn">→</button>
  <div id="log" style="padding:6px;font-size:12px;opacity:.6"></div>
  <div id="historyPanel" style="
  position: fixed;
  right: 0;
  top: 0;
  width: 320px;
  height: 100vh;
  background:#1a1a1a;
  border-left:1px solid #333;
  overflow-y:auto;
  padding:10px;
  box-sizing:border-box;
">
  <h3>履歴</h3>

  <div style="margin-bottom:10px;">
    <button onclick="loadHistory()">全部</button>
    <button onclick="loadHistory('idea')">発想</button>
    <button onclick="loadHistory('analysis')">解析</button>
  </div>

  <div id="historyList"></div>
</div>

</div>

<script>
/* =====================================================
   設定
===================================================== */
const PAGE_URL = {
  idea: "idea.html",
  analysis: "analysis.html",
  image: "image.html"
};

let overlayEnabled = false;
let centerIndex = 0;
let globalCount = 0;

let analysisCount = 0;
let ideaCount = 0;

function resetChildCounters() {
  analysisCount = 0;
  ideaCount = 0;
}

/* =====================================================
   データ
===================================================== */
let uid = 0;
const genId = () => "card-" + uid++;

const deck = [
  { id: genId(), type: 'image', label: '画像' },
  { id: genId(), type: 'idea', label: '発想(0)' },
  { id: genId(), type: 'analysis', label: '解析(0)' }
];


const cardArea = document.getElementById("cardArea");
const cardMap = new Map();
const executedMap = new Map(); // cardId -> true

/* =====================================================
   util
===================================================== */
function getVisibleIndices() {
  const start = Math.max(0, centerIndex - 1);
  const end = Math.min(deck.length - 1, centerIndex + 1);
  return Array.from({ length: end - start + 1 }, (_, i) => start + i);
}

function sendToIframe(iframe, type, payload) {
  iframe.contentWindow?.postMessage({ type, payload }, location.origin);
}

function startImage(card) {
  const entry = cardMap.get(card.id);
  if (!entry) return;

  entry.iframe.contentWindow.postMessage({
    type: "START_IMAGE",
    payload: {
      cardId: card.id
    }
  }, location.origin);
}

function spawnFromCard(sourceCard) {

  const index = deck.findIndex(c => c.id === sourceCard.id);

  if (index === -1) return;

  if (sourceCard.type === "idea") {
    ideaCount++;

    deck[index].label = `発想(${ideaCount})`;
  }

  if (sourceCard.type === "analysis") {
    analysisCount++;

    deck[index].label = `解析(${analysisCount})`;
  }

  deck[index].sourceText = sourceCard.sourceText;

  const entry = cardMap.get(deck[index].id);

  // ラベル更新
  entry.el.querySelector(".card-type").textContent = deck[index].label;

  sendToIframe(
    entry.iframe,
    sourceCard.type === "analysis"
      ? "START_ANALYSIS"
      : "START_IDEA",
    {
      cardId: deck[index].id,
      text: deck[index].sourceText
    }
  );
}


/* =====================================================
   カード生成
===================================================== */
  function startAnalysis(card) {
  const entry = cardMap.get(card.id);
  if (!entry) return;

  const imageText = imageResultMap.get(card.id);

  entry.iframe.contentWindow.postMessage({
    type: "START_ANALYSIS",
    payload: {
      cardId: card.id,
      text: imageText ?? "画像生成結果がまだありません"
    }
  }, location.origin);
}
function createCard(card) {
  const el = document.createElement("div");
  el.className = "card";
  el.dataset.cardId = card.id;
  el.setAttribute("draggable", true);

  el.addEventListener("dragstart", e => {
    e.preventDefault();
  });

  const label = document.createElement("div");
  label.className = "card-type";
  label.textContent = card.label;

  const wrap = document.createElement("div");
  wrap.className = "iframe-wrap";

  const iframe = document.createElement("iframe");
  iframe.src = PAGE_URL[card.type];
  iframe.dataset.cardId = card.id;
  iframe.dataset.cardType = card.type;

  iframe.onload = () => {
    iframe.contentWindow.postMessage({
      type: "INIT",
      payload: { cardId: card.id }
    }, location.origin);
  };

  const overlay = document.createElement("div");
  overlay.className = "swipe-layer";

  let startX = 0;

  el.addEventListener("pointerdown", e => {
    startX = e.clientX;
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener("pointerup", e => {
    const dist = e.clientX - startX;
    if (Math.abs(dist) < 40) return;

    if (card.type === "image") return;

    spawnFromCard(card);
  });

  wrap.appendChild(iframe);
  el.append(label, wrap, overlay);
  cardArea.appendChild(el);

  cardMap.set(card.id, { el, iframe, overlay });
}

/* =====================================================
   render
===================================================== */

  function getImageIndex() {
  return deck.findIndex(c => c.type === "image");
}

function render() {

  cardMap.forEach(v => v.el.classList.remove("visible"));

  getVisibleIndices().forEach(i => {
    const card = deck[i];
    const entry = cardMap.get(card.id);
    if (!entry) return;

    entry.el.classList.add("visible");

    if (card.type === "image") {
      startImage(card);
    }
  });
}




/* =====================================================
   swipe 処理
===================================================== */
function handleSwipe(dist, index) {
  const parent = deck[index];
  
  if (parent.type === "image") return;
  const type = parent.type; // ← 親と同じタイプだけ生成

  const card = {
  id: genId(),
  type,
  parentId: parent.id,
  label: type === "idea"
    ? `発想(${++ideaCount})`
    : `解析(${++analysisCount})`,
  sourceText: parent.sourceText
};


  deck.splice(index + 1, 0, card);
  createCard(card);
  render();
}

/* ================= IndexedDB ================= */
const DB_NAME = 'cardDB';
const STORE = 'cards';
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);

    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        db.createObjectStore(STORE, {
          keyPath: 'id',
          autoIncrement: true
        });
      }
    };

    req.onsuccess = e => {
      db = e.target.result;
      resolve(db);
    };

    req.onerror = e => reject(e);
  });
}

/* ===== 保存処理（sourceWindow に結果を返す） ===== */
function saveResult(data) {
  function saveResult(data) {
  console.log("保存しようとしている:", data); // ←追加
  if (!db) return;

  if (!db) return;

  const tx = db.transaction(STORE, 'readwrite');
  const store = tx.objectStore(STORE);

  store.add({
    createdAt: Date.now(),
    ...data
  });

  tx.oncomplete = () => {
    console.log("DB save success");
    loadHistory(); // ← これを追加🔥
  };

  tx.onerror = () => {
    console.error("DB save error");
  };
}

function loadHistory(filterType = null) {
  if (!db) return;

  const tx = db.transaction(STORE, 'readonly');
  const store = tx.objectStore(STORE);
  const request = store.getAll();

  request.onsuccess = () => {
    let results = request.result;

    // 最新順
    results.sort((a, b) => b.createdAt - a.createdAt);

    if (filterType) {
  results = results.filter(r => 
    (r.type || "").toLowerCase() === filterType.toLowerCase()
  );
}

    renderHistory(results);
  };
}
function renderHistory(list) {
  const container = document.getElementById("historyList");
  container.innerHTML = "";

  if (list.length === 0) {
    container.innerHTML = "<p>データなし</p>";
    return;
  }
  
   list.forEach(item => {
    const div = document.createElement("div");
    div.style.border = "1px solid #333";
    div.style.padding = "8px";
    div.style.marginBottom = "8px";
    div.style.borderRadius = "6px";
    div.style.background = "#222";

    div.innerHTML = `
      <div style="font-size:12px;opacity:.6">
        ${new Date(item.createdAt).toLocaleString()}
      </div>
      <div style="font-size:12px;color:#4fc3f7;margin:4px 0">
        ${item.type.toUpperCase()}
      </div>
      <div style="font-size:13px;white-space:pre-wrap;">
        ${item.text}
      </div>
    `;

    div.onclick = () => {
    const ideaCard = deck.find(c => c.type === "idea");
    const analysisCard = deck.find(c => c.type === "analysis");

    const targetCard =
      item.type === "idea" ? ideaCard : analysisCard;

    sendToIframe(
      cardMap.get(targetCard.id).iframe,
      "RESTORE_STRUCTURE",
      {
        cardId: targetCard.id,
        structure: item.structure
      }
    );
  };
  container.appendChild(div);
});
}

/* ===== idea / analysis iframe へ一斉通知 ===== */
function broadcastUpdate(payload, sourceWindow) {
  document.querySelectorAll("iframe").forEach(ifr => {
    if (ifr.contentWindow === sourceWindow) return;

    const type = ifr.dataset.cardType;
    if (type === "analysis" || type === "idea") {
      ifr.contentWindow.postMessage(
        {
          type: "DB_UPDATE",
          payload
        },
        location.origin
      );
    }
  });
}

/* ================= iframe からの結果受信 ================= */
const imageResultMap = new Map(); // cardId -> text

window.addEventListener("message", event => {
  if (event.origin !== location.origin) return;

  const { type, payload } = event.data || {};
  if (!type) return;

  if (type === "ANALYSIS_RESULT") {
  const { cardId, result, structure } = payload;

  saveResult({
    cardId,
    type: "analysis",
    text: result,
    sourceText: deck.find(c => c.id === cardId)?.sourceText || "",
    structure
  });
}


  if (type === "IDEA_RESULT") {
    console.log("IDEA_RESULT受信:", payload);
    const { cardId, result, structure } = payload;

   saveResult({
  cardId,
  type: "idea",
  text: result,
  sourceText: deck.find(c => c.id === cardId)?.sourceText || "",
  structure
});

  }

  if (type === "IMAGE_TEXT_READY") {
    resetChildCounters();

  imageResultMap.set(payload.cardId, payload.text);

  const ideaCard = deck.find(c => c.type === "idea");
  const analysisCard = deck.find(c => c.type === "analysis");

  ideaCount = 1;
  analysisCount = 1;

  ideaCard.label = `発想(${ideaCount})`;
  analysisCard.label = `解析(${analysisCount})`;

  ideaCard.sourceText = payload.text;
  analysisCard.sourceText = payload.text;

  // ラベル更新
  cardMap.get(ideaCard.id)
    .el.querySelector(".card-type")
    .textContent = ideaCard.label;

  cardMap.get(analysisCard.id)
    .el.querySelector(".card-type")
    .textContent = analysisCard.label;

  sendToIframe(
    cardMap.get(ideaCard.id).iframe,
    "START_IDEA",
    { cardId: ideaCard.id, text: payload.text }
  );

  sendToIframe(
    cardMap.get(analysisCard.id).iframe,
    "START_ANALYSIS",
    { cardId: analysisCard.id, text: payload.text }
  );

  }
});


/* =====================================================
   iframe → 親 通信
===================================================== */


/* =====================================================
   初期化
===================================================== */
deck.forEach(createCard);
render();

document.getElementById("leftBtn").onclick = () => {
  if (centerIndex > 0) centerIndex--, render();
};

document.getElementById("rightBtn").onclick = () => {
  if (centerIndex < deck.length - 1) centerIndex++, render();
};

openDB().then(() => {
  log("IndexedDB ready");
  loadHistory();
});


/* ================= ログ ================= */
const logEl = document.getElementById("log");
function log(msg) {
  if (logEl) logEl.textContent = msg;
  console.log(msg);
}
</script>
</body>
</html>
