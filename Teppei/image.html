<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Image → Word Summary</title>
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; background: #111; color: #fff; }
    button { padding: 10px 20px; margin-top: 10px; border: none; border-radius: 6px; cursor: pointer; }
    #preview { margin-top: 20px; max-width: 300px; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>Image → Summary Word</h2>

  <input type="file" id="fileInput" accept="image/*" />
  <button id="sendBtn">解析</button>

  <img id="preview" />
  <div id="output"></div>
  <pre id="out"></pre> 
  <!-- 編集済み(デバック２) -->
  
<script>
const API_URL = "https://dr-cube-1.onrender.com/chat";

let cardId = null;
let autoStart = false;

/* ================= 画像選択 ================= */
document.getElementById("fileInput").addEventListener("change", handleFile);
document.getElementById("sendBtn").addEventListener("click", processImage);

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById("preview").src = ev.target.result;

    if (autoStart && cardId) {
      processImage();
    }
  };
  reader.readAsDataURL(file);
}

/* ================= 画像解析 ================= */
async function processImage() {
  if (!cardId) return;

  const img = document.getElementById("preview").src;
  if (!img) return;

  const payload = { prompt: "画像から単語抽出", image: img };

  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await res.json();
  // ★ APIの返答を確認
  console.log("API response:", data);

  const word = data?.reply?.trim() || "(no result)";

  // ★ 画面に表示する
  document.getElementById("output").textContent = word;
  document.getElementById("out").textContent = JSON.stringify(data, null, 2);

  // 親にも送信（これはそのままでOK）
  parent.postMessage({
    type: "IMAGE_TEXT_READY",
    payload: { cardId, text: word }
  }, location.origin);
    
  const word = data?.reply?.trim() || "(no result)";

  parent.postMessage({
    type: "IMAGE_TEXT_READY",
    payload: { cardId, text: word }
  }, location.origin);
}

/* ================= 親からの通信 ================= */
window.addEventListener("message", e => {
  if (e.origin !== location.origin) return;

  const { type, payload } = e.data || {};

  if (type === "INIT") {
    cardId = payload.cardId;
    console.log("🟢 INIT:", cardId);
  }

  if (type === "START_IMAGE") {
    autoStart = true;
    console.log("🚀 START_IMAGE");
  }
});
</script>



</body>
</html>
