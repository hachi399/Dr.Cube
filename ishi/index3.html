<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaze Tracking Web - 3D to 2D Regression</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <style>
        body { font-family: sans-serif; background: #222; color: #eee; margin: 0; display: flex; flex-direction: column; align-items: center; }
        h1 { margin: 10px 0; font-size: 1.2rem; }
        .controls { background: #333; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        select, button { padding: 8px; border-radius: 4px; border: none; cursor: pointer; }
        button.primary { background: #00aaff; color: white; font-weight: bold; }
        button.danger { background: #ff4444; color: white; }
        
        .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .view-box { position: relative; border: 2px solid #555; }
        video { display: none; } /* Videoタグは隠してCanvasに描画 */
        canvas { display: block; background: #000; }
        
        .overlay-text {
            position: absolute; top: 10px; left: 10px; 
            background: rgba(0,0,0,0.5); padding: 5px; pointer-events: none;
        }
        #status { color: #0f0; font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>

    <h1>Web Gaze Calibration (IndexedDB)</h1>

    <div class="controls">
        <select id="selFrontCam"><option value="">正面カメラを選択</option></select>
        <select id="selFishCam"><option value="">魚眼(投影)カメラを選択</option></select>
        <button id="btnStart" class="primary">カメラ開始</button>
        <div style="border-left:1px solid #666; width:1px;"></div>
        <button id="btnCalibStart">キャリブ開始 (C)</button>
        <button id="btnTrain">学習実行 (T)</button>
        <button id="btnSaveSnap">スナップショット (S)</button>
        <button id="btnClear" class="danger">データ削除</button>
        <span id="status">待機中...</span>
    </div>

    <div class="container">
        <div class="view-box">
            <canvas id="canvasFront" width="640" height="480"></canvas>
            <div class="overlay-text">Front Camera (Tracking)</div>
        </div>
        
        <div class="view-box">
            <canvas id="canvasFish" width="640" height="480"></canvas>
            <div class="overlay-text">Target View (Calibration)</div>
        </div>
    </div>

    <video id="videoFront" playsinline autoplay></video>
    <video id="videoFish" playsinline autoplay></video>

<script>
/**
 * 構成:
 * 1. IndexedDBUtils: DB保存周り
 * 2. MathUtils: 回帰計算、フィルタ
 * 3. GazeLogic: 3Dベクトル計算 (Pythonロジックの移植)
 * 4. App: メインループとUI制御
 */

// ==========================================
// 1. IndexedDB Utils
// ==========================================
const DB_NAME = "GazeCalibDB";
const DB_VERSION = 1;
const STORE_CALIB = "calib_data";
const STORE_MODEL = "regression_model";
const STORE_SNAPS = "snapshots";

class IDB {
    static async open() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_CALIB)) db.createObjectStore(STORE_CALIB, { keyPath: "id", autoIncrement: true });
                if (!db.objectStoreNames.contains(STORE_MODEL)) db.createObjectStore(STORE_MODEL, { keyPath: "name" });
                if (!db.objectStoreNames.contains(STORE_SNAPS)) db.createObjectStore(STORE_SNAPS, { keyPath: "time" });
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    static async save(storeName, data) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(storeName, "readwrite");
            const store = tx.objectStore(storeName);
            const req = store.put(data);
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.error);
        });
    }

    static async getAll(storeName) {
        const db = await this.open();
        return new Promise((resolve) => {
            const tx = db.transaction(storeName, "readonly");
            const req = tx.objectStore(storeName).getAll();
            req.onsuccess = () => resolve(req.result);
        });
    }
    
    static async get(storeName, key) {
        const db = await this.open();
        return new Promise((resolve) => {
            const tx = db.transaction(storeName, "readonly");
            const req = tx.objectStore(storeName).get(key);
            req.onsuccess = () => resolve(req.result);
        });
    }

    static async clearAll() {
        const db = await this.open();
        const stores = [STORE_CALIB, STORE_MODEL, STORE_SNAPS];
        for (const s of stores) {
            const tx = db.transaction(s, "readwrite");
            tx.objectStore(s).clear();
        }
        console.log("DB Cleared");
    }
}

// ==========================================
// 2. Math & Filter Logic
// ==========================================

// OneEuroFilter (簡易移植版)
class OneEuroFilter {
    constructor(freq = 60, minCutoff = 1.0, beta = 0.03, dCutoff = 1.0) {
        this.freq = freq;
        this.minCutoff = minCutoff;
        this.beta = beta;
        this.dCutoff = dCutoff;
        this.xPrev = null;
        this.dxPrev = null;
        this.lastTime = null;
    }

    filter(x) {
        const t = performance.now() / 1000;
        if (this.lastTime === null) {
            this.lastTime = t;
            this.xPrev = x;
            this.dxPrev = 0;
            return x;
        }
        let dt = t - this.lastTime;
        this.lastTime = t;
        if (dt <= 0) dt = 1.0 / this.freq;
        
        const cutoff = this.minCutoff; // 簡易化: ベータ計算省略可だが、Python通りなら実装が必要
        // 今回はシンプルなローパスフィルタとして実装し、ラグを防ぎます
        const alpha = this.smoothingFactor(t, cutoff);
        const xHat = x * alpha + this.xPrev * (1.0 - alpha);
        
        this.xPrev = xHat;
        return xHat;
    }

    smoothingFactor(t, cutoff) {
        const r = 2 * Math.PI * cutoff;
        return r / (r + this.freq);
    }
}

// Pythonの poly3_features と同じ特徴量生成
function getPoly3Features(x, y, z) {
    // [1, x, y, z, x^2, y^2, z^2, xy, yz, xz]
    return [
        1.0, x, y, z, 
        x*x, y*y, z*z, 
        x*y, y*z, x*z
    ];
}

// 学習処理 (math.js利用)
function trainModel(calibData) {
    // calibData structure: [{gaze3d: [x,y,z], target: [u,v]}, ...]
    if (calibData.length < 9) return null;

    const A = [];
    const Yu = [];
    const Yv = [];

    calibData.forEach(d => {
        const feat = getPoly3Features(d.gaze3d[0], d.gaze3d[1], d.gaze3d[2]);
        A.push(feat);
        Yu.push(d.target[0]);
        Yv.push(d.target[1]);
    });

    // 係数計算: w = (A^T * A)^-1 * A^T * Y
    try {
        const matA = math.matrix(A);
        const matYu = math.matrix(Yu);
        const matYv = math.matrix(Yv);
        
        const At = math.transpose(matA);
        const AtA = math.multiply(At, matA);
        const AtA_inv = math.inv(AtA);
        const M = math.multiply(AtA_inv, At);
        
        const coef_u = math.multiply(M, matYu).toArray();
        const coef_v = math.multiply(M, matYv).toArray();

        return { coef_u, coef_v };
    } catch (e) {
        console.error("Training Error:", e);
        return null;
    }
}

function predictGaze(gaze3d, model) {
    if (!model) return null;
    const f = getPoly3Features(gaze3d[0], gaze3d[1], gaze3d[2]);
    let u = 0, v = 0;
    for(let i=0; i<f.length; i++){
        u += f[i] * model.coef_u[i];
        v += f[i] * model.coef_v[i];
    }
    return [u, v];
}

// ==========================================
// 3. Gaze Logic (3D Calculation)
// ==========================================
// 定数
const REAL_IPD = 0.064; 
const EYE_OFFSET = -0.012; 
const ID_IRIS_L = [468, 469, 470, 471];
const ID_IRIS_R = [473, 474, 475, 476];
const ID_OUTER_L = 33, ID_INNER_L = 133;
const ID_OUTER_R = 263, ID_INNER_R = 362;

// カメラパラメータ（仮定: 一般的なWebカメラの画角60度程度）
// 厳密にはキャリブレーションJSONを読むべきですが、Webでは推定値で動かすことが多いです。
let camParams = { fx: 640, fy: 640, cx: 320, cy: 240 }; 

function processLandmarks(landmarks, width, height) {
    // 座標変換ヘルパー
    const toPx = (lm) => [lm.x * width, lm.y * height];
    const toCam = (px, depth) => {
        const x = (px[0] - camParams.cx) * depth / camParams.fx;
        const y = (px[1] - camParams.cy) * depth / camParams.fy;
        return [x, y, depth];
    };
    
    // 距離推定 (IPDベース)
    const pOuterL = toPx(landmarks[ID_OUTER_L]);
    const pOuterR = toPx(landmarks[ID_OUTER_R]);
    const pixDist = Math.hypot(pOuterR[0] - pOuterL[0], pOuterR[1] - pOuterL[1]);
    const distance = (REAL_IPD * camParams.fx) / (pixDist + 1e-6);

    // 虹彩中心 (簡易平均)
    const getIrisAvg = (ids) => {
        let sx=0, sy=0;
        ids.forEach(i => { sx += landmarks[i].x; sy += landmarks[i].y; });
        return [sx/ids.length * width, sy/ids.length * height];
    };
    const irisL_px = getIrisAvg(ID_IRIS_L);
    const irisR_px = getIrisAvg(ID_IRIS_R);

    // 眼球中心推定 (PythonコードのfitEllipseは省略し、虹彩から少し奥にあると仮定、またはFaceMeshの眼球ランドマークを使用)
    // 簡易化のため、虹彩の3D位置を計算
    const irisL_3d = toCam(irisL_px, distance);
    const irisR_3d = toCam(irisR_px, distance);

    // 顔の向き (Pythonコードの forward ベクトル計算の簡易版)
    // 左右の目のベクトルと直交するベクトルなどを計算するのが正確ですが、
    // ここでは FaceMesh の geometry を信頼して簡易計算します。
    // 左目中心と右目中心の中点を顔中心とします。
    const faceCenter = [(irisL_3d[0]+irisR_3d[0])/2, (irisL_3d[1]+irisR_3d[1])/2, distance];
    
    // 注視ベクトル (本来は眼球中心が必要ですが、ここでは顔平面からのオフセットで代用、あるいはIris位置そのものを特徴量にする)
    // ★Pythonコードのロジックを再現するために重要なのは「3D空間でのIrisの位置」です。
    // 回帰モデルが「3D座標 -> 2D画面」を学習するため、入力が安定していれば厳密な眼球中心でなくても学習可能です。
    // ここではシンプルに「左右のIrisの3D座標の中点」を Gaze3D 特徴とします。
    
    const gaze3d = [
        (irisL_3d[0] + irisR_3d[0]) / 2,
        (irisL_3d[1] + irisR_3d[1]) / 2,
        distance
    ];

    return { gaze3d, distance, irisL: irisL_px, irisR: irisR_px };
}

// ==========================================
// 4. Main Application
// ==========================================
const videoFront = document.getElementById('videoFront');
const videoFish = document.getElementById('videoFish');
const canvasFront = document.getElementById('canvasFront');
const canvasFish = document.getElementById('canvasFish');
const ctxFront = canvasFront.getContext('2d');
const ctxFish = canvasFish.getContext('2d');
const statusEl = document.getElementById('status');

// 状態管理
let state = {
    isCalibrating: false,
    calibIndex: 0,
    calibPoints: [
        {x: 0.25, y: 0.25}, {x: 0.5, y: 0.25}, {x: 0.75, y: 0.25},
        {x: 0.25, y: 0.5},  {x: 0.5, y: 0.5},  {x: 0.75, y: 0.5},
        {x: 0.25, y: 0.75}, {x: 0.5, y: 0.75}, {x: 0.75, y: 0.75}
    ], // 画面比率
    samples: [],
    model: null,
    currentGaze3d: null,
    gazeHistory: [] // 移動平均用
};

// MediaPipe FaceMesh
const faceMesh = new FaceMesh({locateFile: (file) => {
  return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
}});
faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});
faceMesh.onResults(onResults);

// カメラ起動
async function startCameras() {
    const idFront = document.getElementById('selFrontCam').value;
    const idFish = document.getElementById('selFishCam').value;

    if(!idFront || !idFish) {
        alert("両方のカメラを選択してください");
        return;
    }

    // 正面カメラ
    const streamFront = await navigator.mediaDevices.getUserMedia({ 
        video: { deviceId: idFront ? { exact: idFront } : undefined, width: 640, height: 480 } 
    });
    videoFront.srcObject = streamFront;
    await videoFront.play();

    // 魚眼カメラ
    const streamFish = await navigator.mediaDevices.getUserMedia({ 
        video: { deviceId: idFish ? { exact: idFish } : undefined, width: 640, height: 480 } 
    });
    videoFish.srcObject = streamFish;
    await videoFish.play();

    // カメラパラメータ更新
    camParams.fx = 640; camParams.fy = 640; // 仮
    camParams.cx = 320; camParams.cy = 240;

    // ループ開始
    processLoop();
    
    // DBからモデル読み込み
    const savedModel = await IDB.get(STORE_MODEL, "gaze_model");
    if(savedModel) {
        state.model = savedModel.data;
        statusEl.textContent = "学習済みモデルをロードしました";
    }
}

// メインループ
async function processLoop() {
    // FaceMeshにフレームを送る
    await faceMesh.send({image: videoFront});
    
    // 魚眼側の描画更新（FaceMeshの結果コールバックとは非同期になる可能性があるためここで呼ぶか、onResultsで呼ぶか）
    // ここでは requestAnimationFrame で回す
    drawFishEyeView();
    requestAnimationFrame(processLoop);
}

// FaceMesh 結果処理
function onResults(results) {
    ctxFront.clearRect(0, 0, canvasFront.width, canvasFront.height);
    ctxFront.drawImage(results.image, 0, 0, canvasFront.width, canvasFront.height);

    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        
        // 3D視線特徴の計算
        const data = processLandmarks(landmarks, canvasFront.width, canvasFront.height);
        state.currentGaze3d = data.gaze3d;

        // デバッグ描画
        ctxFront.fillStyle = "cyan";
        ctxFront.beginPath(); ctxFront.arc(data.irisL[0], data.irisL[1], 3, 0, 2*Math.PI); ctxFront.fill();
        ctxFront.beginPath(); ctxFront.arc(data.irisR[0], data.irisR[1], 3, 0, 2*Math.PI); ctxFront.fill();
        
        ctxFront.fillStyle = "white";
        ctxFront.fillText(`Z: ${data.distance.toFixed(3)}m`, 10, 30);
    } else {
        state.currentGaze3d = null;
    }
}

// 魚眼側（ターゲット表示・推定点表示）
function drawFishEyeView() {
    const w = canvasFish.width;
    const h = canvasFish.height;

    ctxFish.clearRect(0, 0, w, h);
    ctxFish.drawImage(videoFish, 0, 0, w, h);

    // キャリブレーションモード
    if (state.isCalibrating) {
        if (state.calibIndex < state.calibPoints.length) {
            const pt = state.calibPoints[state.calibIndex];
            const tx = pt.x * w;
            const ty = pt.y * h;

            // 赤い点
            ctxFish.fillStyle = "red";
            ctxFish.beginPath(); ctxFish.arc(tx, ty, 15, 0, 2*Math.PI); ctxFish.fill();
            
            ctxFish.fillStyle = "white";
            ctxFish.font = "20px Arial";
            ctxFish.fillText(`Look here & Press Enter (${state.calibIndex+1}/9)`, 20, 50);
        } else {
            state.isCalibrating = false;
            statusEl.textContent = "キャリブ完了。't'キーで学習してください。";
        }
    } else {
        // 推論モード
        if (state.model && state.currentGaze3d) {
            const pred = predictGaze(state.currentGaze3d, state.model);
            if (pred) {
                // 移動平均
                state.gazeHistory.push(pred);
                if (state.gazeHistory.length > 10) state.gazeHistory.shift();
                
                let avgU = 0, avgV = 0;
                state.gazeHistory.forEach(p => { avgU += p[0]; avgV += p[1]; });
                avgU /= state.gazeHistory.length;
                avgV /= state.gazeHistory.length;

                // 緑の点
                ctxFish.fillStyle = "#0f0";
                ctxFish.beginPath(); ctxFish.arc(avgU, avgV, 10, 0, 2*Math.PI); ctxFish.fill();
                
                // 座標表示
                ctxFish.fillStyle = "#fff";
                ctxFish.fillText(`Gaze: ${Math.round(avgU)}, ${Math.round(avgV)}`, avgU + 15, avgV);
            }
        }
    }
}

// キーボード操作
window.addEventListener('keydown', async (e) => {
    // キャリブレーション (Enter/Space)
    if ((e.code === 'Enter' || e.code === 'Space') && state.isCalibrating) {
        if (!state.currentGaze3d) {
            console.warn("視線が検出されていません");
            return;
        }
        
        // サンプリング (Python版はここで数フレーム待機するが、JS版は簡易的に現在の値を数回取得したとみなすか、非同期で収集する)
        // ここではシンプルに「現在の値を信頼して保存」にします（実用時はここをWaitループにする）
        // Python版のようにサンプリングを集めるなら async/await ループが必要
        
        statusEl.textContent = "サンプリング中...";
        const samples = [];
        for(let i=0; i<15; i++) {
            if(state.currentGaze3d) samples.push([...state.currentGaze3d]);
            await new Promise(r => setTimeout(r, 30)); // 30ms待機
        }
        
        if (samples.length > 0) {
            // 中央値計算 (簡易版: 平均を使う)
            let mx=0, my=0, mz=0;
            samples.forEach(s => { mx+=s[0]; my+=s[1]; mz+=s[2]; });
            const med = [mx/samples.length, my/samples.length, mz/samples.length];
            
            // 保存
            const pt = state.calibPoints[state.calibIndex];
            const target = [pt.x * canvasFish.width, pt.y * canvasFish.height];
            
            // DB保存
            await IDB.save(STORE_CALIB, { gaze3d: med, target: target });
            
            console.log(`Point ${state.calibIndex+1} Saved`, med, target);
            state.calibIndex++;
            statusEl.textContent = `Point ${state.calibIndex}/9 完了`;
        }
    }

    // 学習 (t)
    if (e.key === 't') {
        runTraining();
    }
    
    // キャリブリセット (c)
    if (e.key === 'c') {
        startCalibration();
    }
    
    // スナップショット (s)
    if (e.key === 's') {
        takeSnapshot();
    }
});

// ボタンイベント
document.getElementById('btnStart').onclick = startCameras;
document.getElementById('btnCalibStart').onclick = startCalibration;
document.getElementById('btnTrain').onclick = runTraining;
document.getElementById('btnSaveSnap').onclick = takeSnapshot;
document.getElementById('btnClear').onclick = async () => {
    if(confirm("全データを削除しますか？")) {
        await IDB.clearAll();
        state.model = null;
        statusEl.textContent = "データ削除完了";
    }
};

// ヘルパー関数
function startCalibration() {
    state.isCalibrating = true;
    state.calibIndex = 0;
    IDB.clearAll().then(() => statusEl.textContent = "キャリブレーション開始: 赤い点を見てEnter");
}

async function runTraining() {
    const data = await IDB.getAll(STORE_CALIB);
    console.log("Training with data:", data);
    if (data.length < 9) {
        alert("データが足りません (現在: " + data.length + "点)");
        return;
    }
    
    const model = trainModel(data);
    if (model) {
        state.model = model;
        await IDB.save(STORE_MODEL, { name: "gaze_model", data: model });
        statusEl.textContent = "学習完了！視線が表示されます。";
        console.log("Model saved:", model);
    } else {
        alert("学習に失敗しました");
    }
}

async function takeSnapshot() {
    // 画面キャプチャ
    const u_avg = state.gazeHistory.length > 0 ? state.gazeHistory[state.gazeHistory.length-1][0] : 0;
    const v_avg = state.gazeHistory.length > 0 ? state.gazeHistory[state.gazeHistory.length-1][1] : 0;

    const snapData = {
        time: Date.now(),
        gaze_2d_mean: [u_avg, v_avg],
        image_blob: await new Promise(r => canvasFish.toBlob(r)) // 画像保存
    };
    
    await IDB.save(STORE_SNAPS, snapData);
    statusEl.textContent = "スナップショット保存完了(DB)";
    console.log("Snapshot saved", snapData);
}

// カメラ列挙
navigator.mediaDevices.enumerateDevices().then(devices => {
    const selFront = document.getElementById('selFrontCam');
    const selFish = document.getElementById('selFishCam');
    devices.filter(d => d.kind === 'videoinput').forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.text = d.label || `Camera ${d.deviceId.substr(0,5)}`;
        selFront.appendChild(opt.cloneNode(true));
        selFish.appendChild(opt);
    });
});

</script>
</body>
</html>
